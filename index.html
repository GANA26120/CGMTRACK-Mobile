/* Hors-périmètre effectif : règle métier fixe + sélection dynamique régions/dépts/pays */
const hpEffectif = (c, depts, pays) => {
  if (c.horsPerimetre) return c.horsPerimetre;
  if (c.pays === "FR") {
    /* Fourniture de skids ET de gaines : France entière et Europe (règle fixe, rappelée
       par Gilles le 28/08). CGM fabrique en atelier et livre partout. Un avis dont le
       titre parle de pose a déjà été écarté par le robot, et arrive ici avec son motif. */
    if (c.famille === "Skids" || c.famille === "Gaines de ventilation") return null;
    return depts[c.dept] ? null : `Département ${c.dept} désactivé dans le périmètre actif`;
  }
  /* Un pays européen sans interrupteur propre est couvert par « EU ». */
  return (pays[c.pays] || pays["EU"]) ? null : `${c.pays} désactivé dans le périmètre actif`;
};
/* Les trois postures. « AO amont » (issue #5, décision du 26/08) : un marché global

const POSTURE = {

const FAMILLES = ["Skids", "Gaines de ventilation", "Tuyauterie industrielle"];
const FAM_COURT = { "Skids": "Skids", "Gaines de ventilation": "Gaines", "Tuyauterie industrielle": "Tuyauterie" };

/* ---------- Grille ---------- */
const CRITERES = [
  { id: "tech", label: "Adéquation technique", poids: 4, niveaux: ["Hors périmètre", "Adaptation nécessaire", "Match parfait"] },
  { id: "montant", label: "Montant estimé", poids: 3, niveaux: ["< 15 k€", "15–80 k€", "> 80 k€"] },
  { id: "zone", label: "Zone géographique", poids: 2, niveaux: ["Hors périmètre", "Zone limitrophe", "Dépt cible / ES·IT·MA fourniture"] },
  { id: "delai", label: "Délai de réponse", poids: 2, niveaux: ["< 5 jours", "5–15 jours", "> 15 jours"] },
  { id: "concu", label: "Concurrence estimée", poids: 1, niveaux: ["Forte (>5)", "Modérée (2–5)", "Faible (<2)"] },
  { id: "recur", label: "Potentiel récurrence", poids: 2, niveaux: ["Ponctuel", "Renouvellement possible", "Accord-cadre"] },
  { id: "ref", label: "Référence stratégique", poids: 2, niveaux: ["Aucune", "Référence utile", "1ère réf. pays/secteur"] },
  { id: "complex", label: "Complexité réponse", poids: 1, niveaux: ["Lourde (>3 j)", "Modérée (1–3 j)", "Simple (<1 j)"] },
];
const calcScore = (s) => CRITERES.reduce((a, c) => a + c.poids * (s[c.id] || 1), 0);

/* COMBIEN DE JOURS IL RESTE VRAIMENT — règle n° 17, appliquée à l'échéance.
   « deadline » est un nombre de jours écrit par la veille : juste le matin où elle
   est passée, faux le surlendemain. La DATE (« echeance_le »), elle, ne dérive pas.
   On compte donc à partir d'elle quand on l'a, et on retombe sur le décompte de la
   veille sinon. Sans l'une ni l'autre : null — on ne devine pas une échéance. */
function joursRestants(c) {
  const brut = (c || {}).echeance_le;
  if (brut) {
    const d = new Date(String(brut).slice(0, 10) + "T12:00:00");
    if (!isNaN(d.getTime())) {
      const midi = new Date();
      midi.setHours(12, 0, 0, 0);
      return Math.max(Math.round((d - midi) / 86400000), 0);
    }
  }
  const j = (c || {}).deadline;
  return typeof j === "number" ? j : null;
}
const verdict = (score, hp) =>
  hp ? { label: "NO GO", detail: "Exclu automatiquement — règle de périmètre", color: T.nogo, soft: T.nogoSoft }
  : score >= 45 ? { label: "GO", detail: "Lancer la réponse", color: T.go, soft: T.goSoft }
  : score >= 35 ? { label: "ANALYSE", detail: "Zone grise — évaluer les critères qualitatifs", color: T.amber, soft: T.amberSoft }
  : { label: "NO GO", detail: "Archiver et surveiller le résultat", color: T.nogo, soft: T.nogoSoft };

/* ---------- Charge atelier (saisie simplifiée % / mois) ---------- */
/* Capacité réelle (photo écrite par positionnement.py dans consultations.json).
   La cadence TRADUIT un montant en mois d'atelier — elle n'écarte jamais une
   affaire (règle métier n° 9 : la cadence informe, elle ne choisit pas). */
const CAPACITE = { cadence_eur_mois: null, equipes: {} };
/* État de la veille : sources réellement interrogées et heure du dernier passage. */
const ETAT = { synchro: null, sources: null };
/* Le cockpit (brique 6) : ce que les cinq briques ont à dire, en une page.
   Vide tant que scripts/cockpit.py n'a pas tourné — et il vaut mieux une page
   qui dit « pas encore mesurable » qu'une page qui affiche des zéros. */
const COCKPIT = { chiffres: [], aujourdhui: [], vigilance: [], manque: [], regle: null };
/* La boucle gagné-perdu (session 5) : ce qui s'est joué, et ce que la machine
   n'a pas osé trancher seule. */
const BOUCLE = { bilan: {}, fermees_ce_matin: [], a_confirmer: [] };
/* Les prix RÉELLEMENT observés (data/prix_marche.json) — jamais estimés ici. */
const MARCHE = { observations: [] };

/* ---------- Consultations ---------- */
/* Le drapeau de chaque pays que TED peut rapporter. Un code sans drapeau
   s'affichait tout nu dans la barre PAYS (IE, SK, CZ, NO...). */
const PAYS_FLAG = { FR: "🇫🇷", ES: "🇪🇸", IT: "🇮🇹", MA: "🇲🇦", TN: "🇹🇳", EU: "🇪🇺", DE: "🇩🇪", BE: "🇧🇪", NL: "🇳🇱", PT: "🇵🇹", PL: "🇵🇱", CH: "🇨🇭", AT: "🇦🇹", IE: "🇮🇪", SK: "🇸🇰", CZ: "🇨🇿", RO: "🇷🇴", SI: "🇸🇮", MT: "🇲🇹", SE: "🇸🇪", BG: "🇧🇬", FI: "🇫🇮", DK: "🇩🇰", GR: "🇬🇷", NO: "🇳🇴", HU: "🇭🇺", HR: "🇭🇷", LT: "🇱🇹", LV: "🇱🇻", EE: "🇪🇪", LU: "🇱🇺", CY: "🇨🇾", IS: "🇮🇸", UK: "🇺🇰", GB: "🇬🇧", RS: "🇷🇸", TR: "🇹🇷" };

/* LA BASE PART VIDE — audit du 08/09. Cent trente lignes de consultations
   inventées vivaient ici (« AO-2026-0352 », campus de la Doua, CCTP indice B…),
   remplacées au démarrage par le vrai fichier — MAIS SEULEMENT S'IL SE CHARGEAIT.
   Le 31/08, la lecture avait échoué sur le poste de Gilles et la page a affiché sept

const CONSULTATIONS = [];
/* Vrai tant que data/consultations.json n'a pas été lu. La page le DIT au lieu de
   laisser croire à une matinée sans affaires. */
const CHARGEMENT = { echec: null };

/* ---------- Rétro-planning (généré au Go) ---------- */

/* ---------- Bibliothèque ---------- */
/* Bibliothèque : alimentée par data/bibliotheque/etat.json au démarrage.
   Les listes ci-dessous servent de démonstration tant que le fichier n'existe pas. */
const BIBLIO = { admin: [], blocs: [], references: [], alertes: [] };
/* Signaux d'attribution et registre des majors, chargés au démarrage. */
const REGISTRE = { signaux: [], majors: [] };
/* Brief du matin, chargé au démarrage depuis data/brief.json. */
const BRIEF = { date_longue: "", resume: "", rubriques: [] };
/* Propositions de partenariat préparées par l'agent (scripts/prospection.py). */
const PROSPECTION = { propositions: [] };
/* Les consultations privées saisies à la main (data/decisions.json → saisies).

const SAISIES = { liste: {} };

/* Les départements que Gilles a ajoutés lui-même au périmètre de RECHERCHE, depuis la

const PERIMETRE = { depts_ajoutes: [] };
const ATELIER = { carnet: [], carnet_total_eur: 0, ateliers: [], alertes: [],
                  non_planifiables: [], en_attente_de_reponse: [] };

/* ---------- Boucle gagné-perdu ---------- */
/* LES CONSTANTES DE DÉMONSTRATION SONT PARTIES — 07/09. RESULTATS, BENCHMARKS et
   CONCURRENTS vivaient ici : cinq affaires gagnées ou perdues, quatre prix de marché

   Ne jamais remettre de données de démonstration dans cette page : elles finissent
   toujours par passer pour la réalité (règle métier n° 10). */

/* ---------- UI de base ---------- */
function Badge({ children, color, soft }) {
  return (
    <span style={{ fontFamily: FM, fontSize: 11, fontWeight: 600, color, background: soft, border: `1px solid ${color}33`, borderRadius: 3, padding: "2px 7px", letterSpacing: "0.04em", whiteSpace: "nowrap" }}>
      {children}
    </span>
  );
}
const FamilleBadge = ({ famille }) => {
  const m = FAM_COLOR[famille] || { c: T.steel, s: "#EEF1F3" };
  /* Une famille non reconnue vaut null (règle métier n° 10) : elle se dit « à qualifier »,
     elle ne fait PAS tomber la page. */
  return <Badge color={m.c} soft={m.s}>{String(FAM_COURT[famille] || famille || "à qualifier").toUpperCase()}</Badge>;
};
function Panel({ children, style, id }) {
  /* id : pour qu'un bouton du bas de fiche puisse ramener l'oeil sur un panneau du haut. */
  return <div id={id} style={{ background: T.panel, border: `1px solid ${T.line}`, borderRadius: 6, padding: "14px 16px", ...style }}>{children}</div>;
}
function SectionTitle({ children }) {
  return <div style={{ fontFamily: FM, fontSize: 10.5, fontWeight: 700, color: T.steel, letterSpacing: "0.08em", marginBottom: 8 }}>{children}</div>;
}

function Gauge({ score, compact = false }) {
  const pct = Math.min(100, (score / 85) * 100);
  const v = verdict(score, false);
  const ticks = [0, 10, 20, 30, 35, 45, 55, 65, 75, 85];
  return (
    <div style={{ width: "100%" }}>
      <div style={{ position: "relative", height: compact ? 10 : 16, borderRadius: 3, overflow: "hidden", background: "#E7EBEE", border: `1px solid ${T.line}` }}>
        <div style={{ position: "absolute", left: 0, width: `${(35 / 85) * 100}%`, top: 0, bottom: 0, background: `${T.nogo}22` }} />
        <div style={{ position: "absolute", left: `${(35 / 85) * 100}%`, width: `${(10 / 85) * 100}%`, top: 0, bottom: 0, background: `${T.amber}26` }} />
        <div style={{ position: "absolute", left: `${(45 / 85) * 100}%`, right: 0, top: 0, bottom: 0, background: `${T.go}22` }} />
        <div style={{ position: "absolute", left: 0, width: `${pct}%`, top: 0, bottom: 0, background: v.color, opacity: 0.85, transition: "width .35s ease" }} />
        <div style={{ position: "absolute", left: `calc(${pct}% - 1px)`, top: -2, bottom: -2, width: 2, background: T.ink, transition: "left .35s ease" }} />
      </div>
      {!compact && (
        <div style={{ position: "relative", height: 18, marginTop: 3 }}>
          {ticks.map((t) => (
            <span key={t} style={{ position: "absolute", left: `${(t / 85) * 100}%`, transform: "translateX(-50%)", fontFamily: FM, fontSize: 10, color: t === 35 || t === 45 ? T.ink : T.steel, fontWeight: t === 35 || t === 45 ? 700 : 400 }}>{t}</span>
          ))}
        </div>
      )}
    </div>
  );
}

/* ---------- Le cockpit (brique 6) : piloter CGM en trois minutes ----------
   La page unique du dirigeant. Elle ne calcule rien : elle affiche ce que
   scripts/cockpit.py a rassemblé. Un indicateur sans source n'affiche JAMAIS
   zéro — il dit ce qui le rendra mesurable. Un zéro se lit comme un résultat,
   et ce n'en est pas un. */
function Cockpit({ onOpen, onOnglet }) {
  const { chiffres, aujourdhui, vigilance, manque, genere } = COCKPIT;
  const format = (c) => {
    if (c.valeur == null) return "—";
    if (c.unite === "€") return Math.round(c.valeur).toLocaleString("fr-FR") + " €";
    if (c.unite === "%") return c.valeur + " %";
    return String(c.valeur);
  };
  const couleurUrgence = { haute: T.nogo, normale: T.blue, patiente: T.steel };
  const motUrgence = { haute: "aujourd'hui", normale: "cette semaine", patiente: "à suivre" };

  if (!chiffres.length) {
    return (
      <Panel>
        <SectionTitle>COCKPIT</SectionTitle>
        <p style={{ margin: 0, fontSize: 13.5, color: T.steel }}>
          Le cockpit n'a pas encore tourné. Il se remplit à la prochaine veille
          (<code style={{ fontFamily: FM }}>scripts/cockpit.py</code>).
        </p>
      </Panel>
    );
  }

  return (
    <div style={{ display: "grid", gap: 14 }}>
      <div>
        <h2 style={{ fontFamily: FD, fontWeight: 800, fontSize: 19, margin: "0 0 2px" }}>
          Où en est CGM
        </h2>
        <p style={{ margin: 0, fontSize: 12, color: T.steel }}>
          Chaque chiffre vient d'un fichier réel. Ce qui n'est pas mesurable est dit tel quel,
          jamais remplacé par un zéro.{genere ? ` Calculé le ${genere.slice(8, 10)}/${genere.slice(5, 7)} à ${genere.slice(11, 16)}.` : ""}
        </p>
      </div>

      {/* Les six chiffres du dirigeant */}
      <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(170px, 1fr))", gap: 10 }}>
        {chiffres.map((c) => (
          <Panel key={c.cle} style={{ padding: "12px 14px" }}>
            <div style={{ fontFamily: FM, fontSize: 10, fontWeight: 700, color: T.steel, letterSpacing: "0.06em", textTransform: "uppercase" }}>
              {c.libelle}
            </div>
            <div style={{ fontFamily: FD, fontWeight: 800, fontSize: c.valeur == null ? 20 : 26, color: c.valeur == null ? T.line : T.ink, margin: "4px 0 2px" }}>
              {format(c)}
              {c.valeur != null && c.unite && c.unite !== "€" && c.unite !== "%" && (
                <span style={{ fontSize: 12, fontWeight: 600, color: T.steel, marginLeft: 5 }}>{c.unite}</span>
              )}
            </div>
            <div style={{ fontSize: 11.5, color: T.steel, lineHeight: 1.4 }}>
              {c.valeur == null ? c.manque : c.detail}
            </div>
          </Panel>
        ))}
      </div>

      {/* Les gestes du jour */}
      <Panel>
        <SectionTitle>À FAIRE AUJOURD'HUI ({aujourdhui.length})</SectionTitle>
        {!aujourdhui.length && (
          <p style={{ margin: 0, fontSize: 13, color: T.steel }}>
            Rien ne presse ce matin. Aucun geste n'est inventé pour remplir la page.
          </p>
        )}
        {aujourdhui.map((g, i) => (
          <div key={i} style={{ display: "flex", gap: 10, padding: "9px 0", borderTop: i ? `1px solid ${T.line}` : "none" }}>
            <span style={{ fontFamily: FM, fontSize: 9.5, fontWeight: 700, color: couleurUrgence[g.urgence] || T.steel, minWidth: 74, paddingTop: 2, textTransform: "uppercase", letterSpacing: "0.04em" }}>
              {motUrgence[g.urgence] || g.urgence}
            </span>
            <div style={{ flex: 1 }}>
              <div style={{ fontWeight: 600, fontSize: 13.5, lineHeight: 1.35 }}>
                {g.id && onOpen ? (
                  <button onClick={() => onOpen(g.id)}
                    style={{ background: "none", border: "none", padding: 0, cursor: "pointer", font: "inherit", color: T.blue, textAlign: "left" }}>
                    {g.quoi}
                  </button>
                ) : g.quoi}
              </div>
              <div style={{ fontSize: 12, color: T.steel, marginTop: 2 }}>{g.pourquoi}</div>
              {/* UN GESTE QUI DIT « OÙ » DOIT Y EMMENER — 08/09. Gilles : « j'ai un
                  message sur CGMTRACK mais je ne sais pas où aller le lire ». Le
                  cockpit annonçait « 5 actions préparées : e-mails et messages
                  attendent votre accord » et renvoyait à « la rubrique à valider du
                  brief » — du texte, sans un seul endroit où cliquer. C'est la
                  règle n° 14 : si CGMTRACK réclame quelque chose, il offre l'endroit
                  où le faire, ou il se tait. */}
              {g.ou && (
                <div style={{ fontFamily: FM, fontSize: 11, color: T.steel, marginTop: 3, wordBreak: "break-word" }}>
                  {String(g.ou).startsWith("http")
                    ? <a href={g.ou} target="_blank" rel="noreferrer" style={{ color: T.blue }}>{g.ou}</a>
                    : g.onglet && onOnglet
                      ? <button onClick={() => onOnglet(g.onglet, g.id, g.filtre)}
                          style={{ fontFamily: FM, fontSize: 11, fontWeight: 700, color: T.blue,
                                   background: "#fff", border: `1px solid ${T.blue}55`,
                                   borderRadius: 3, padding: "3px 9px", cursor: "pointer" }}>
                          → {g.ou}
                        </button>
                      : g.ou}
                </div>
              )}
            </div>
          </div>
        ))}
      </Panel>

      {/* Ce qui s'est joué cette nuit */}
      {!!(BOUCLE.fermees_ce_matin || []).length && (
        <Panel>
          <SectionTitle>AFFAIRES CLOSES CETTE NUIT ({BOUCLE.fermees_ce_matin.length})</SectionTitle>
          {BOUCLE.fermees_ce_matin.map((f, i) => (
            <div key={i} style={{ fontSize: 13, lineHeight: 1.45, marginTop: i ? 6 : 0 }}>
              <span style={{ fontFamily: FM, fontSize: 10, fontWeight: 700, color: f.statut === "gagne" ? T.go : T.steel, marginRight: 8 }}>
                {f.statut === "gagne" ? "GAGNÉE" : "PERDUE"}
              </span>
              {f.titre}
              <span style={{ color: T.steel }}>
                {f.statut === "gagne" ? "" : ` — ${f.titulaire}`}
                {f.montant ? ` · ${Math.round(f.montant).toLocaleString("fr-FR")} €` : ""}
              </span>
            </div>
          ))}
        </Panel>
      )}

      {/* Ce qui coince */}
      {!!vigilance.length && (
        <Panel style={{ background: T.amberSoft, borderColor: T.amber }}>
          <SectionTitle>POINTS DE VIGILANCE ({vigilance.length})</SectionTitle>
          {vigilance.map((v, i) => (
            <div key={i} style={{ fontSize: 13, lineHeight: 1.45, marginTop: i ? 6 : 0 }}>
              {v.quoi}
              <span style={{ fontFamily: FM, fontSize: 10.5, color: T.steel, marginLeft: 6 }}>· {v.source}</span>
            </div>
          ))}

      {/* Ce qu'il faut renseigner pour que le cockpit dise davantage */}
      {!!manque.length && (
        <Panel>
          <SectionTitle>CE QUI MANQUE POUR EN DIRE PLUS ({manque.length})</SectionTitle>
          <p style={{ margin: "0 0 8px", fontSize: 12, color: T.steel }}>
            La contrepartie de « on n'invente rien » : quand un chiffre est absent,

          {manque.map((m, i) => (
            <div key={i} style={{ fontSize: 12.5, lineHeight: 1.45, marginTop: i ? 6 : 0, color: T.steel }}>· {m}</div>
          ))}
        </Panel>
      )}
    </div>
  );
}

/* ---------- Plan de charge (réel) ----------
   Chaque affaire en réponse directe est traduite en mois d'atelier à la cadence
   déclarée. C'est une INFORMATION pour préparer la réponse (phaser, renforcer,
   partager avec le titulaire) — jamais un filtre : un marché plus gros que
   l'atelier reste une affaire à prendre. Rien n'est inventé : sans montant au
   dossier, la ligne le dit ; sans cadence déclarée, le panneau le dit. */
function ChargeAtelier({ focus }) {
  const cadence = CAPACITE.cadence_eur_mois;
  const directes = CONSULTATIONS.filter(
    (c) => !c.horsPerimetre && c.positionnement && c.positionnement.posture === "directe"
  );
  const parAtelier = {};
  directes.forEach((c) => {
    const nom = c.atelier || c.famille || "Autre";
    (parAtelier[nom] = parAtelier[nom] || []).push(c);
  });
  const kEuros = (v) => (v >= 1_000_000 ? `${(v / 1_000_000).toFixed(1).replace(".", ",").replace(",0", "")} M€` : `${Math.round(v / 1000)} k€`);
  return (
    <Panel style={{ marginBottom: 14 }}>
      <SectionTitle>PLAN DE CHARGE ATELIER — IRIGNY</SectionTitle>
      {cadence ? (
        <div style={{ fontSize: 11.5, color: T.steel, marginBottom: 8 }}>
          L'atelier sort ≈ <b>{kEuros(cadence)}/mois</b>
          {Object.keys(CAPACITE.equipes).length > 0 && (
            <> ({[...new Set(Object.values(CAPACITE.equipes))].join(" · ")})</>
          )}. La cadence informe, elle ne choisit jamais une affaire.
        </div>
      ) : (
        <div style={{ fontSize: 12, color: T.steel }}>
          Cadence d'atelier non renseignée (config.json → capacite) : le plan de charge ne peut pas être chiffré.
        </div>
      )}
      {cadence && Object.keys(parAtelier).length === 0 && (
        <div style={{ fontSize: 12.5, color: T.steel }}>
          Aucune affaire en réponse directe pour l'instant — le plan de charge se remplit depuis les dossiers suivis.
        </div>
      )}
      {cadence && Object.entries(parAtelier).map(([nom, affaires]) => {
        const surligne = focus && focus.atelier === nom;
        return (
          <div key={nom} style={{ marginTop: 6, padding: "7px 10px", borderRadius: 6, background: surligne ? T.blueSoft : "#FAFBFC", border: `1px solid ${surligne ? T.blue : T.line}` }}>
            <span style={{ fontSize: 12.5, fontWeight: 700, color: T.ink }}>{nom}</span>
            <span style={{ fontFamily: FM, fontSize: 11, color: T.steel, marginLeft: 8 }}>{affaires.length} affaire(s) en direct</span>
            {affaires.map((c) => {
              const montant = c.positionnement && c.positionnement.montant_estime_eur;
              const mois = montant ? montant / cadence : null;
              return (
                <div key={c.id} style={{ fontSize: 12, color: T.ink, marginTop: 3 }}>
                  • {(c.titre || "").slice(0, 60)}{(c.titre || "").length > 60 ? "…" : ""} —{" "}
                  {montant ? (
                    <span style={{ fontFamily: FM }}>
                      {kEuros(montant)} ≈ <b>{mois >= 10 ? Math.round(mois) : mois.toFixed(1).replace(".", ",")} mois d'atelier</b>
                      {c.duree_mois ? ` pour un délai de ${c.duree_mois} mois — ${mois > c.duree_mois ? "à phaser, renforcer ou partager avec le titulaire" : "le calendrier tient"}` : ""}
                    </span>
                  ) : (
                    <span style={{ color: T.steel }}>montant à extraire du DCE — charge non chiffrable</span>
                  )}
                </div>
              );
            })}
          </div>
        );
      })}
    </Panel>
  );
}

/* ---------- Périmètre configurable ---------- */
function Perimetre({ depts, setDepts, pays, setPays }) {
  const [ajoutes, setAjoutes] = useState(() => PERIMETRE.depts_ajoutes.slice());
  const [message, setMessage] = useState(null);
  const ecriture = window.CGMTRACK_ECRITURE;
  /* Le périmètre de RECHERCHE = le plancher de config.json + ce que Gilles a ajouté.
     Aller chercher plus loin est volontaire, et c'est sa décision : le 03 ou le 63 ne
     sont pas interdits, ils ne sont simplement pas cherchés tant qu'il ne l'a pas dit. */
  const cherche = (d) => DEPTS.indexOf(d) !== -1 || ajoutes.indexOf(d) !== -1;
  const toggleDept = (d) => setDepts((s) => ({ ...s, [d]: !s[d] }));

  async function ecrirePerimetre(liste, texte) {
    if (!ecriture || !ecriture.possible()) {
      setMessage("Étendre la recherche s'enregistre dans le dépôt : cela demande la copie de " +
                 "bureau et le jeton d'écriture (le même que pour marquer une affaire).");
      return false;
    }
    setMessage("Enregistrement…");
    try {
      let base = { decisions: {} };
      try {
        const r = await fetch(ecriture.fichier + "?t=" + Date.now(), { cache: "no-store" });
        if (r.ok) {
          const lu = await r.json();
          base = normaliserDecisions(lu);
        }
      } catch (e) { /* fichier absent : on le crée */ }
      /* On COMPLÈTE la section, on ne la remplace pas : « perimetre » porte aussi
         « affaires », c'est-à-dire toutes les fiches que Gilles a sorties du
         tableau. Une affectation sèche les effaçait au premier département ajouté. */
      base.perimetre = { ...(base.perimetre || {}),
                         depts_ajoutes: liste,
                         modifie_le: new Date().toISOString().slice(0, 10),
                         par: "Gilles (application)" };
      base.maj_le = new Date().toISOString().slice(0, 16);
      await ecriture.ecrire(ecriture.fichier, JSON.stringify(base, null, 1), texte);
      PERIMETRE.depts_ajoutes = liste;
      setAjoutes(liste);
      setMessage(texte + " — la veille de demain matin ira y chercher.");
      return true;
    } catch (e) {
      setMessage(String(e.message || e));
      return false;
    }
  }

  async function etendre(d) {
    if (await ecrirePerimetre(ajoutes.concat([d]).sort(), `Recherche étendue au département ${d}`)) {
      setDepts((s) => ({ ...s, [d]: true }));
    }
  }

  async function restreindre(d) {
    if (await ecrirePerimetre(ajoutes.filter((x) => x !== d), `Département ${d} retiré de la recherche`)) {
      setDepts((s) => { const n = { ...s }; delete n[d]; return n; });
    }
  }
  const toggleRegion = (r) => {
    const cherches = r.depts.filter(cherche);
    const tousActifs = cherches.every((d) => depts[d]);
    setDepts((s) => {
      const n = { ...s };
      cherches.forEach((d) => (n[d] = !tousActifs));
      return n;
    });
  };
  const nbActifs = Object.values(depts).filter(Boolean).length;

  return (
    <Panel style={{ padding: "12px 14px", marginBottom: 14 }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", flexWrap: "wrap", gap: 6 }}>
        <SectionTitle>PÉRIMÈTRE D'ACTION — FILTRE D'AFFICHAGE</SectionTitle>
        <span style={{ fontFamily: FM, fontSize: 11, color: T.blue, fontWeight: 700 }}>{nbActifs} dépts actifs</span>
      </div>
      <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
        {REGIONS.map((r) => {
          const cherches = r.depts.filter(cherche);
          const actifs = cherches.filter((d) => depts[d]).length;
          const tous = cherches.length > 0 && actifs === cherches.length;
          return (
            <div key={r.nom} style={{ display: "flex", gap: 8, alignItems: "flex-start", flexWrap: "wrap" }}>
              <button onClick={() => toggleRegion(r)}
                style={{ fontFamily: FB, fontSize: 12, fontWeight: 700, minWidth: 210, textAlign: "left", padding: "4px 8px", borderRadius: 4, cursor: "pointer", border: `1px solid ${actifs > 0 ? T.blue : T.line}`, background: tous ? T.blueSoft : T.panel, color: actifs > 0 ? T.blue : T.steel }}>
                {tous ? "☑" : actifs > 0 ? "◪" : "☐"} {r.nom} <span style={{ fontFamily: FM, fontWeight: 400 }}>({actifs}/{cherches.length})</span>
              </button>
              <span style={{ display: "inline-flex", gap: 3, flexWrap: "wrap", paddingTop: 4 }}>
                {r.depts.map((d) => {
                  /* Trois états, et un seul geste par état :
                     · cherché (socle de config.json) : la case filtre l'affichage ;
                     · ajouté par Gilles : idem, plus un « × » pour reprendre sa décision ;
                     · pas encore cherché : le clic ÉTEND la recherche. Aller plus loin est
                       volontaire — ce n'est ni interdit, ni définitif. */
                  if (!cherche(d)) {
                    return (
                      <button key={d} onClick={() => etendre(d)}
                        title={"Département " + d + " : pas encore cherché. Cliquez pour étendre la recherche — la veille de demain matin ira y chercher des avis."}
                        style={{ fontFamily: FM, fontSize: 10.5, cursor: "pointer", background: "#FBFCFC", border: `1px dashed ${T.line}`, borderRadius: 3, padding: "2px 6px", color: "#9AA6AE" }}>
                        {d}
                      </button>
                    );
                  }
                  const ajoute = ajoutes.indexOf(d) !== -1;
                  return (
                    <span key={d} style={{ display: "inline-flex" }}>
                      <button onClick={() => toggleDept(d)}
                        title={ajoute ? "Département " + d + " : ajouté par vous au périmètre de recherche."
                                      : "Département " + d + " : au périmètre de recherche (config.json)."}
                        style={{ fontFamily: FM, fontSize: 10.5, cursor: "pointer", background: depts[d] ? T.blue : "#EEF1F3", border: `1px solid ${depts[d] ? T.blue : T.line}`, borderRight: ajoute ? "none" : undefined, borderRadius: ajoute ? "3px 0 0 3px" : 3, padding: "2px 6px", color: depts[d] ? "#fff" : T.steel, fontWeight: depts[d] ? 700 : 400 }}>
                        {d}
                      </button>
                      {ajoute && (
                        <button onClick={() => restreindre(d)}
                          title={"Retirer le département " + d + " du périmètre de recherche."}
                          style={{ fontFamily: FM, fontSize: 9.5, cursor: "pointer", background: depts[d] ? T.blue : "#EEF1F3", border: `1px solid ${depts[d] ? T.blue : T.line}`, borderLeft: `1px solid ${depts[d] ? "#5A8AE0" : T.line}`, borderRadius: "0 3px 3px 0", padding: "2px 4px", color: depts[d] ? "#CFE0FA" : T.steel }}>
                          ×
                        </button>
                      )}
                    </span>
                  );
                })}
              </span>
            </div>
          );
        })}
        <div style={{ display: "flex", gap: 8, alignItems: "baseline", flexWrap: "wrap" }}>
          <span style={{ fontSize: 12, fontWeight: 700, color: T.ink, minWidth: 210 }}>🇫🇷 Skids & gaines — fourniture seule</span>
          <span style={{ fontSize: 12, color: T.ink }}>France entière, indépendamment de la sélection (règle fixe). La pose et le raccordement, eux, suivent la sélection départementale.</span>
        </div>
        <div style={{ display: "flex", gap: 8, alignItems: "center", flexWrap: "wrap", borderTop: `1px dashed ${T.line}`, paddingTop: 8 }}>
          <span style={{ fontSize: 12, fontWeight: 700, color: T.ink, minWidth: 210 }}>Export — fourniture seule : toute l'Europe 🇪🇺, Maroc, Tunisie</span>
          {PAYS_EXPORT.map((p) => (
            <button key={p} onClick={() => setPays((s) => ({ ...s, [p]: !s[p] }))}
              style={{ fontFamily: FM, fontSize: 11.5, cursor: "pointer", background: pays[p] ? T.blue : "#EEF1F3", border: `1px solid ${pays[p] ? T.blue : T.line}`, borderRadius: 3, padding: "3px 9px", color: pays[p] ? "#fff" : T.steel, fontWeight: pays[p] ? 700 : 400 }}>
              {PAYS_FLAG[p]} {p}
            </button>
          ))}
          <span style={{ fontSize: 11.5, color: T.steel }}>— pose et tuyauterie excluses à l'export (règle fixe)</span>
          <span style={{ fontSize: 11.5, color: T.steel, flexBasis: "100%" }}>
            🇪🇺 <b>EU</b> couvre tous les autres pays européens — et les avis TED dont le pays
            n'a pas pu être identifié. Le décocher les cache tous.
          </span>
        </div>
      </div>
      <div style={{ fontSize: 11.5, color: T.steel, marginTop: 8 }}>
        Les départements <b>pleins</b> sont cherchés chaque matin ; la case filtre alors
        seulement ce que la page affiche. Ceux <b>en pointillé</b> ne sont pas encore
        cherchés : <b>cliquez dessus pour étendre la recherche</b> — c'est votre décision,
        elle s'enregistre dans le dépôt et la veille de demain matin ira y chercher.
        Le « × » la reprend. Le socle de départ est dans
        <code style={{ fontFamily: FM }}> config.json → perimetre.depts_actifs</code>.
        {message && <span style={{ display: "block", marginTop: 6, color: T.blue }}>{message}</span>}
      </div>
    </Panel>
  );
}

/* ---------- Dashboard ---------- */
/* Le brief du matin : ce que la nuit a produit, en tête de page. Repliable, parce
   qu'on ne le relit pas dix fois dans la journée. */
function BriefDuMatin() {
  const [ouvert, setOuvert] = useState(true);
  if (!BRIEF.rubriques || !BRIEF.rubriques.length) return null;
  return (
    <Panel style={{ padding: 16, marginBottom: 14, borderLeft: `4px solid ${T.blue}` }}>
      <button onClick={() => setOuvert(!ouvert)}
        style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", gap: 10, width: "100%", background: "none", border: "none", padding: 0, cursor: "pointer", textAlign: "left", flexWrap: "wrap" }}>
        <span style={{ fontFamily: FD, fontWeight: 700, fontSize: 15, color: T.ink }}>
          Brief du matin — {BRIEF.date_longue}
        </span>
        <span style={{ fontFamily: FM, fontSize: 11.5, color: T.steel }}>{ouvert ? "réduire ▲" : "déplier ▼"}</span>
      </button>
      <div style={{ fontFamily: FM, fontSize: 12, color: T.blue, marginTop: 4 }}>{BRIEF.resume}</div>
      {ouvert && BRIEF.rubriques.map((r, i) => (

            <div key={j} style={{ fontSize: 12.5, color: T.ink, lineHeight: 1.5, padding: "3px 0", borderTop: j > 0 ? `1px solid ${T.line}` : "none" }}
              dangerouslySetInnerHTML={{ __html: texteBrief(ligne) }} />
          ))}
        </div>
      ))}
    </Panel>

}

/* Le brief est écrit en Markdown léger : on n'en rend que le gras et les retours
   à la ligne, après avoir neutralisé le HTML. */
function texteBrief(ligne) {
  const neutre = String(ligne).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  return neutre.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>").replace(/\n/g, "<br>");
}

/* Une affaire dont le dossier n'a pas pu être remonté, et qui attend encore une
   décision. Une affaire close ou sortie du tableau n'a plus besoin de son dossier. */
const sansDossier = (c) => {
  const d = c.docs || {};
  return !!d.manuel && !(d.pieces || []).length
    && !c.ecartee_a_la_main && !(c.resultat || {}).statut;
};

function Dashboard({ onOpen, fp, setFp, ff, setFf, fe, setFe, depts, setDepts, pays, setPays, version }) {
  /* fe (« À FAIRE ») vit au niveau de l'application, comme fp et ff. Il était local
     au tableau : ouvrir une fiche démontait le composant, et le filtre repartait sur
     « Tout » au retour. Gilles arbitrait une affaire, revenait pour la suivante, et
     retombait sur les cent huit — 31/08 : « il est toujours là quand je reviens en
     arrière pour passer à la suivante ». */
  /* LES QUATRE COMPTEURS DOIVENT DIRE VRAI — constat de Gilles, 07/09 : « je ne
     suis pas sûr que les compteurs fonctionnent sur la page Fil d'alerte ». Mesuré :
     deux d'entre eux mentaient.
     · « détections cette semaine » affichait CONSULTATIONS.length, c'est-à-dire toute
       la base — 23 alors que 11 avaient été publiées dans les sept derniers jours. Un
       libellé qui promet une semaine et rend un total est un chiffre faux, pas une
       approximation. Il se calcule maintenant sur la date de publication, et sur elle
       seule : une consultation sans date n'est pas comptée plutôt que devinée.
     · « opportunités en zone GO » comptait les affaires que Gilles venait de refuser
       ou d'écarter. Il affichait 1 le matin où il avait tout tranché, et cette
       unique affaire était justement celle qu'il avait refusée. Une affaire close ou
       écartée n'est plus une opportunité : c'est bien ce compteur-là « qui ne tourne
       pas ». */
  const kpis = useMemo(() => {
    const hp = (c) => hpEffectif(c, depts, pays);
    const tranchee = (c) => !!(c.resultat || {}).statut || !!c.ecartee_a_la_main;
    const limite = new Date(Date.now() - 7 * 86400000).toISOString().slice(0, 10);
    return {
      semaine: CONSULTATIONS.filter((c) => c.publie && String(c.publie).slice(0, 10) >= limite).length,
      go: CONSULTATIONS.filter((c) => !hp(c) && !tranchee(c) && calcScore(c.scores) >= 45).length,
      exclues: CONSULTATIONS.filter((c) => hp(c)).length,
      admin: (BIBLIO.admin || []).filter((p) => !p.ok).length,
    };
    /* « version » est bougé par CGMTRACK_REDESSINE à chaque décision. Sans lui dans
       les dépendances, les compteurs gardent leur valeur d'avant le geste : ils ne
       tournent que parce que revenir de la fiche remonte le composant, ce qui est
       un hasard d'implémentation, pas une garantie. Un compteur qui dépend du chemin
       qu'on a pris pour arriver jusqu'à lui finira par mentir. */
  }, [depts, pays, version]);
  /* TROUVER CE QU'ON DOIT TRANCHER — demande de Gilles, 31/08 : « je ne trouve
     pas où sont ces affaires où je dois arbitrer », puis « je n'ai rien ».
     Elles étaient bien là, avec leur badge, mais noyées parmi cent huit
     consultations et sans aucun moyen de les isoler. Un badge ne remplace pas
     un filtre : ce qui attend une décision doit pouvoir s'afficher SEUL. */
  /* SORTIR DU TABLEAU — demande de Gilles, 01/09 : « étant donné que celle-ci ne
     correspond pas à notre scope d'action, je veux avoir la possibilité de la sortir
     du tableau ». Une affaire qu'il a écartée quitte le fil : c'est tout l'intérêt du
     geste. Elle n'est pas effacée pour autant — le filtre « Écartées » la rouvre, et
     « Finalement, la prendre » la ramène. On ne perd jamais une donnée collectée. */
  const visibles = CONSULTATIONS.filter((c) =>
    (fp === "Tous" || c.pays === fp)
    && (ff === "Toutes" || c.famille === ff)
    && (fe === "Écartées" ? !!c.ecartee_a_la_main : !c.ecartee_a_la_main)
    /* UNE AFFAIRE CLOSE QUITTE LE FIL — 02/09. Gilles a marqué la Norvège « perdue »
       deux fois dans la journée, et la fiche est restée là : « la Norvège ne s'efface
       toujours pas ». Marquer un résultat, c'est fermer l'affaire ; une affaire fermée
       n'a plus rien à faire dans la liste de ce qu'il reste à décider. Elle n'est pas
       effacée pour autant : le filtre « Closes » la rouvre, et l'onglet
       « Marché & résultats » la garde pour le prix de marché. */
    && (fe === "Closes" ? !!c.resultat : !c.resultat)
    && (fe === "Tout" || fe === "Écartées" || fe === "Closes" || (fe === "Sans dossier" ? sansDossier(c)
                        : fe === "À trancher" ? !!c.a_trancher
                        : fe === "Dans le périmètre" ? (!hpEffectif(c, depts, pays) && !c.a_qualifier && !c.a_trancher && !c.pose_hors_scope)
                        : fe === "Pose — sous-traitance" ? (!!c.pose_hors_scope && !c.pris_hors_perimetre)
                        : fe === "À qualifier" ? !!c.a_qualifier : true)));
  const btn = (a) => ({ fontFamily: FM, fontSize: 12, padding: "5px 12px", borderRadius: 4, cursor: "pointer", border: `1px solid ${a ? T.blue : T.line}`, background: a ? T.blueSoft : T.panel, color: a ? T.blue : T.steel, fontWeight: a ? 700 : 400 });

  return (
    <div>
      <BriefDuMatin />
      <Perimetre depts={depts} setDepts={setDepts} pays={pays} setPays={setPays} />
      <div style={{ display: "grid", gridTemplateColumns: "repeat(4, 1fr)", gap: 10, marginBottom: 14 }}>
        {[
          { n: kpis.semaine, l: `détections cette semaine · ${CONSULTATIONS.length} en base`, c: T.ink },
          { n: kpis.go, l: "en zone GO, à décider", c: T.go },
          { n: kpis.exclues, l: "exclues par règle", c: T.steel },
          { n: kpis.admin, l: "pièces admin à renouveler", c: T.nogo },
        ].map((k, i) => (
          <Panel key={i} style={{ padding: "12px 14px" }}>
            <div style={{ fontFamily: FD, fontWeight: 800, fontSize: 26, color: k.c, lineHeight: 1 }}>{k.n}</div>
            <div style={{ fontSize: 12, color: T.steel, marginTop: 4 }}>{k.l}</div>
          </Panel>
        ))}
      </div>

      <CarnetCommandes />

      <ChargeAtelier />

      {/* Les filtres de la liste. Ils étaient deux rangées de boutons sans titre, tout
          en bas de la page : Gilles ne les trouvait plus (« je n'ai plus la sélection
          des trois domaines »). Une barre nommée, et les domaines annoncés en toutes
          lettres — Skids, Gaines, Tuyauterie — pour qu'on voie ce qu'on peut faire. */}
      <Panel style={{ padding: "10px 14px", marginBottom: 14 }}>
        <div style={{ display: "flex", gap: 10, alignItems: "center", flexWrap: "wrap", marginBottom: 8 }}>
          <span style={{ fontFamily: FM, fontSize: 10.5, fontWeight: 700, color: T.steel, letterSpacing: "0.06em", minWidth: 74 }}>
            À FAIRE
          </span>
          {[["Tout", CONSULTATIONS.filter((c) => !c.ecartee_a_la_main && !c.resultat).length],
            ["À trancher", CONSULTATIONS.filter((c) => c.a_trancher && !c.ecartee_a_la_main && !c.resultat).length],
            ["Dans le périmètre", CONSULTATIONS.filter((c) => !hpEffectif(c, depts, pays) && !c.a_qualifier && !c.a_trancher && !c.pose_hors_scope && !c.ecartee_a_la_main && !c.resultat).length],
            /* La pose est hors scope depuis le 01/09, mais elle reste une piste de
               sous-traitance : il faut pouvoir l'ouvrir en un clic, sinon la règle
               revient à jeter. « À qualifier » ne s'affiche plus que s'il en reste. */
            ["Pose — sous-traitance", CONSULTATIONS.filter((c) => c.pose_hors_scope && !c.pris_hors_perimetre && !c.ecartee_a_la_main && !c.resultat).length],
            ["À qualifier", CONSULTATIONS.filter((c) => c.a_qualifier && !c.ecartee_a_la_main && !c.resultat).length],
            /* SANS DOSSIER — demande de Gilles, 09/09 : « les affaires qu'on n'arrive
               pas à faire remonter, tu me les signifies, tu y ajoutes le lien pour
               l'atteindre, et je m'y connecte ». La fiche portait déjà le lien et le
               bouton de dépôt ; ce qui manquait, c'était de SAVOIR qu'elles existent
               sans ouvrir les cartes une par une. Sept d'entre elles sont hors
               d'atteinte pour toujours (captchas, avis sans adresse) : elles ne
               passeront jamais que par lui. */
            ["Sans dossier", CONSULTATIONS.filter(sansDossier).length],
            /* Ce qu'on a sorti du tableau reste consultable : sans ce bouton, « écarter »
               deviendrait un effacement, et une erreur de clic serait sans retour. */
            ["Écartées", CONSULTATIONS.filter((c) => c.ecartee_a_la_main).length],
            ["Closes", CONSULTATIONS.filter((c) => c.resultat && !c.ecartee_a_la_main).length]]
            .filter(([e, n]) => n || e === "Tout" || e === "À trancher").map(([e, n]) => (
            <button key={e} onClick={() => setFe(e)}
              style={{ ...btn(fe === e),
                       borderColor: fe === e ? T.amber : (e === "À trancher" && n ? T.amber : T.line),
                       color: fe === e ? "#fff" : (e === "À trancher" && n ? T.amber : T.ink),
                       background: fe === e ? T.amber : T.panel,
                       fontWeight: e === "À trancher" && n ? 700 : 400 }}>
              {e}{n ? ` (${n})` : ""}
            </button>
          ))}
        </div>
        <div style={{ display: "flex", gap: 10, alignItems: "center", flexWrap: "wrap" }}>
          <span style={{ fontFamily: FM, fontSize: 10.5, fontWeight: 700, color: T.steel, letterSpacing: "0.06em", minWidth: 74 }}>
            DOMAINE
          </span>
          {["Toutes", ...FAMILLES].map((f) => (
            <button key={f} onClick={() => setFf(f)} style={btn(ff === f)}>
              {f === "Toutes" ? "Les trois" : FAM_COURT[f]}
            </button>
          ))}
        </div>
        <div style={{ display: "flex", gap: 10, alignItems: "center", flexWrap: "wrap", marginTop: 8 }}>
          <span style={{ fontFamily: FM, fontSize: 10.5, fontWeight: 700, color: T.steel, letterSpacing: "0.06em", minWidth: 74 }}>
            PAYS
          </span>
          {/* LA LISTE DES PAYS VIENT DES DONNÉES, plus d'une liste écrite en dur.
              Elle proposait FR, ES, IT, MA, TN — dont deux qui n'ont jamais eu
              le moindre avis — pendant que la base contenait 35 avis allemands
              et 22 polonais, impossibles à afficher. Gilles, 31/08 : « je n'en
              ai que 6 sur europe ». Depuis TED, le pays n'est plus prévisible :
              on montre ce qui est là, dans l'ordre du volume. */}
          {["Tous", ...Array.from(CONSULTATIONS.reduce((m, c) => (
              c.pays ? m.set(c.pays, (m.get(c.pays) || 0) + 1) : m), new Map()))
              .sort((a, b) => b[1] - a[1]).map(([code]) => code)].map((p) => (
            <button key={p} onClick={() => setFp(p)} style={btn(fp === p)}>
              {p === "Tous" ? "Tous"
                : `${PAYS_FLAG[p] || ""} ${p} (${CONSULTATIONS.filter((c) => c.pays === p).length})`.trim()}
            </button>
          ))}
          <span style={{ fontSize: 11.5, color: T.steel }}>
            — {visibles.length} consultation(s) affichée(s) sur {CONSULTATIONS.length}
          </span>
        </div>
      </Panel>

      <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
        {visibles.map((c) => {
          const score = calcScore(c.scores);
          const hp = hpEffectif(c, depts, pays);
          const v = verdict(score, !!hp);
          return (
            <button key={c.id} data-carte={c.id} onClick={() => onOpen(c)}
              style={{ textAlign: "left", background: T.panel, border: `1px solid ${T.line}`, borderLeft: `4px solid ${v.color}`, borderRadius: 6, padding: "14px 16px", cursor: "pointer", width: "100%", opacity: hp && !c.a_trancher ? 0.62 : 1, transition: "box-shadow .15s ease" }}
              onMouseEnter={(e) => (e.currentTarget.style.boxShadow = "0 3px 12px rgba(22,34,46,.08)")}
              onMouseLeave={(e) => (e.currentTarget.style.boxShadow = "none")}>
              <div style={{ display: "flex", justifyContent: "space-between", gap: 12, flexWrap: "wrap", alignItems: "flex-start" }}>
                <div style={{ flex: "1 1 320px", minWidth: 0 }}>
                  <div style={{ display: "flex", gap: 8, alignItems: "center", marginBottom: 6, flexWrap: "wrap" }}>
                    {/* L'ISSUE D'ABORD. Une affaire close retrouvée par le filtre
                        « Closes » avait l'allure exacte d'une affaire à décider —
                        badge « NOUVEAU » compris. On ne peut pas demander à Gilles
                        de se souvenir de ce qu'il a tranché : la carte le dit. */}
                    {(c.resultat || {}).statut === "gagne" && <Badge color={T.go} soft={T.goSoft}>✓ GAGNÉE</Badge>}
                    {(c.resultat || {}).statut === "perdu" && <Badge color={T.nogo} soft={T.nogoSoft}>✗ PERDUE</Badge>}
                    {(c.resultat || {}).statut === "refuse" && <Badge color={T.amber} soft={T.amberSoft}>⊘ REFUSÉE</Badge>}
                    {c.nouveau && !(c.resultat || {}).statut && <Badge color={T.go} soft={T.goSoft}>● NOUVEAU</Badge>}
                    {c.a_trancher && <Badge color={T.amber} soft={T.amberSoft}>⟡ À TRANCHER</Badge>}
                    {c.pose_hors_scope && !c.pris_hors_perimetre &&
                      <Badge color={T.steel} soft="#EEF1F3">POSE — SOUS-TRAITANCE</Badge>}
                    {c.pris_hors_perimetre && <Badge color={T.go} soft={T.goSoft}>PRISE HORS ZONE</Badge>}
                    {c.positionnement && c.positionnement.posture === "directe" &&
                      <Badge color={T.ink} soft="#EEF1F3">RÉPONSE DIRECTE</Badge>}
                    {c.positionnement && c.positionnement.posture === "ao_amont" &&
                      <Badge color={T.blue} soft={T.blueSoft}>AO AMONT</Badge>}
                    {c.positionnement && c.positionnement.posture === "sous-traitance" &&
                      <Badge color={T.amber} soft={T.amberSoft}>SOUS-TRAITANCE</Badge>}
                    <span style={{ fontFamily: FM, fontSize: 11, color: T.steel }}>{c.id}</span>
                    <Badge color={T.blue} soft={T.blueSoft}>{c.source}</Badge>
                    <FamilleBadge famille={c.famille} />
                    <span style={{ fontSize: 13 }}>{PAYS_FLAG[c.pays]}{c.dept && <span style={{ fontFamily: FM, fontSize: 11, color: T.steel }}> {c.dept}</span>}</span>
                    <span style={{ fontFamily: FM, fontSize: 11, color: T.steel }}>{c.publie}</span>
                  </div>
                  <div style={{ fontWeight: 600, fontSize: 14.5, color: T.ink, lineHeight: 1.35 }}>{c.titre}</div>
                  <div style={{ fontSize: 12.5, color: T.steel, marginTop: 4 }}>{c.donneur} · {c.montant}{prochainJalon(c) && <span style={{ fontFamily: FM, fontSize: 11.5, color: T.ink }}> · 🏗 {prochainJalon(c)[0]} : {prochainJalon(c)[1]}</span>}</div>
                  {hp && <div style={{ marginTop: 6, fontSize: 12, color: T.nogo, fontWeight: 600 }}>⛔ {hp}</div>}
                  {c.piece_manquante && <div style={{ marginTop: 6, fontSize: 12, color: T.nogo, fontWeight: 700 }}>⛔ {c.piece_manquante}</div>}
                </div>
                <div style={{ display: "flex", flexDirection: "column", alignItems: "flex-end", gap: 6, minWidth: 130 }}>
                  <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                    <span style={{ fontFamily: FM, fontWeight: 700, fontSize: 18, color: T.ink }}>{score}<span style={{ fontSize: 11, color: T.steel, fontWeight: 400 }}>/85</span></span>
                    <Badge color={v.color} soft={v.soft}>{v.label}</Badge>
                  </div>
                  <span style={{ fontFamily: FM, fontSize: 11, color: joursRestants(c) <= 10 ? T.nogo : T.steel, fontWeight: joursRestants(c) <= 10 ? 700 : 400 }}>⏱ J−{joursRestants(c)}</span>
                </div>
              </div>
              {!hp && <div style={{ marginTop: 10 }}><Gauge score={score} compact /></div>}
            </button>
          );
        })}
      </div>
    </div>
  );
}

/* ---------- Fiche Go/No Go ---------- */

/* ---------- Fiche chantier : dates et informations terrain ---------- */

/* ---------- Documents du DCE : remontée automatique + suivi des versions ---------- */
/* Dépôt GitHub du projet : permet d'ouvrir une pièce du DCE même depuis une
   copie locale du fichier (cgmtrack-bureau.html), qui n'a pas les fichiers à côté. */
const DEPOT = "gana26120/cgmtrack";
const lienPiece = (chemin) => {
  if (!chemin) return null;
  if (/^https?:/i.test(chemin)) return chemin;
  return location.protocol === "file:" ? `https://github.com/${DEPOT}/raw/main/${chemin}` : chemin;
};
const jourMois = (iso) => {
  const p = String(iso || "").slice(0, 10).split("-");
  return p.length === 3 ? `${p[2]}/${p[1]}` : "";
};
const styleBouton = { fontFamily: FM, fontSize: 11, padding: "3px 9px", borderRadius: 3, border: `1px solid ${T.line}`, background: T.panel, color: T.blue, cursor: "pointer", textDecoration: "none" };

/* ---------- Marquer une affaire gagnée ou perdue (session 5, 28/08) ----------
   Les marchés privés ne sont fermés ni par un avis d'attribution — personne ne
   publie le résultat d'une consultation privée — ni forcément par HubSpot, si
   l'affaire n'y a pas de deal. Il faut donc pouvoir le dire à la main.

   L'écriture passe par un SECOND jeton GitHub, séparé du jeton de lecture, et
   le shim de la copie de bureau refuse d'écrire ailleurs que dans
   data/decisions.json. Ce que Gilles marque ici prime sur tout : ni HubSpot ni
   un avis d'attribution ne l'écraseront. */
/* LES MOTIFS DE REFUS — demande de Gilles, 07/09 : « on peut mettre un ascenseur
   avec Délai trop court, Hors métier, Client à risque, Maintenance, il y a de la MO
   avec la Fourniture ». Un motif TAPÉ À LA MAIN ne se compte pas : « délai court »,
   « delai trop court » et « pas le temps » sont trois chaînes différentes pour une
   seule raison. Choisi dans une liste, il devient une statistique — et c'est tout
   l'intérêt du bouton « refusée » : savoir POURQUOI on n'y va pas.
   « Il y a de la main-d'œuvre avec la fourniture » n'est pas un motif comme les
   autres : c'est la règle métier n° 2 bis (le scope, c'est la fourniture seule).
   S'il revient souvent, ce n'est plus Gilles qui doit trier — c'est le filtre de
   collecte qui laisse passer ce qu'il devrait griser. */
const MOTIFS_REFUS = [
  "Délai trop court",
  "Hors métier",
  "Client à risque",
  "Maintenance",
  "Il y a de la main-d'œuvre avec la fourniture",
];

function MarquerResultat({ ao, surEnregistrement }) {
  const { useState } = React;
  const ecriture = window.CGMTRACK_ECRITURE;
  const [ouvert, setOuvert] = useState(null);      // "gagne" | "perdu" | null
  const [montant, setMontant] = useState("");
  const [titulaire, setTitulaire] = useState("");
  const [note, setNote] = useState("");
  const [motif, setMotif] = useState("");
  const [jeton, setJeton] = useState("");
  const [etat, setEtat] = useState(null);          // {type, texte}

  const champ = { width: "100%", padding: "7px 9px", border: `1px solid ${T.line}`,
                  borderRadius: 4, fontFamily: FB, fontSize: 13, marginTop: 4 };
  const bouton = (fond) => ({ padding: "8px 16px", background: fond, color: "#fff",
                              border: "none", borderRadius: 5, fontWeight: 700,
                              fontSize: 13, cursor: "pointer" });

  /* Ouverte depuis le dépôt, sans le shim : on le dit, on ne fait pas semblant. */
  if (!ecriture) {
    return (
      <Panel style={{ padding: 14, marginBottom: 14 }}>
        <SectionTitle>MARQUER LE RÉSULTAT</SectionTitle>
        <div style={{ fontSize: 12.5, color: T.steel }}>
          Se fait depuis la copie de bureau (<code style={{ fontFamily: FM }}>cgmtrack-bureau.html</code>),
          seule à pouvoir écrire dans le dépôt.
        </div>
      </Panel>
    );
  }

  /* Le jeton d'écriture n'existe pas encore : on explique comment le créer. */
  if (!ecriture.possible()) {
    return (
      <Panel style={{ padding: 16, marginBottom: 14 }}>
        <SectionTitle>MARQUER LE RÉSULTAT — À ACTIVER UNE FOIS</SectionTitle>
        <div style={{ fontSize: 12.5, lineHeight: 1.55, color: T.ink }}>
          Marquer une affaire demande un <b>second jeton GitHub</b>, distinct de celui de
          lecture. Il ne pourra écrire qu'un seul fichier :
          <code style={{ fontFamily: FM }}> {ecriture.fichier}</code>.
          <ol style={{ lineHeight: 1.7, paddingLeft: 18 }}>
            <li><a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noreferrer" style={{ color: T.blue }}>GitHub → Fine-grained tokens → Generate new token</a></li>
            <li>Repository access : <b>Only select repositories</b> → {ecriture.depot.split("/")[1]}</li>
            <li>Permissions → Repository permissions → <b>Contents : Read and write</b>. Rien d'autre.</li>
            <li>Générer, copier, coller ci-dessous.</li>
          </ol>
        </div>
        <input type="password" value={jeton} onChange={(e) => setJeton(e.target.value)}
          placeholder="github_pat_…" style={{ ...champ, fontFamily: FM }} />
        <button style={{ ...bouton(T.blue), marginTop: 10 }}
          onClick={() => { if (jeton.trim()) { ecriture.definir(jeton); setJeton(""); setEtat({ type: "ok", texte: "Jeton enregistré." }); } }}>
          Enregistrer sur ce poste
        </button>
        <div style={{ fontSize: 11.5, color: T.steel, marginTop: 8 }}>
          Il reste dans ce navigateur, jamais dans le dépôt, et se révoque en un clic depuis GitHub.
        </div>
        {etat && <div style={{ fontSize: 12.5, color: T.go, marginTop: 6 }}>{etat.texte} Rouvrez la fiche.</div>}
      </Panel>
    );
  }

  async function enregistrer(statut) {
    setEtat({ type: "encours", texte: "Enregistrement…" });
    try {
      /* On relit le fichier pour ne pas écraser les décisions déjà prises. */
      let base = { decisions: {} };
      try {
        const r = await fetch(ecriture.fichier + "?t=" + Date.now(), { cache: "no-store" });
        if (r.ok) {
          const lu = await r.json();
          /* On n'ENVELOPPE JAMAIS le fichier. Cette ligne le faisait, et elle a
             coûté cher le 01/09 à 11h09 : le fichier était encore au format
             historique (les identifiants d'affaire posés à la racine), donc
             « lu.decisions » était absent, et TOUT le fichier est passé sous une
             clé « decisions ». La section « perimetre » a suivi. Or collect.py lit
             « perimetre.affaires » À LA RACINE : le lendemain matin, les SEPT
             affaires que Gilles avait sorties du tableau étaient de retour, sans
             une alerte, sans un test rouge.
             Les sections (perimetre, contacts, maj_le, regle) vivent à la racine,
             à côté des décisions ; un identifiant d'affaire trouvé à la racine
             rejoint « decisions », et lui seul. */
          base = normaliserDecisions(lu);
        }
      } catch (e) { /* fichier absent : on le crée */ }

      const somme = parseFloat(String(montant).replace(/\s/g, "").replace(",", "."));
      // REFUSÉE : ni prix ni titulaire, quoi qu'il reste dans les champs. Il n'y a
      // pas eu d'offre — un montant saisi avant de changer d'avis ne doit pas se
      // glisser dans la mémoire du marché par la porte de derrière.
      const refus = statut === "refuse";
      base.decisions[ao.id] = {
        statut,
        montant_eur: refus || isNaN(somme) || somme <= 0 ? null : somme,
        titulaire: statut === "perdu" && !saisieVide(titulaire) ? titulaire.trim() : null,
        // Le motif choisi et la précision libre sont DEUX choses : l'un se compte,
        // l'autre s'explique. Les mélanger rendrait le comptage faux.
        motif: refus && motif ? motif : null,
        note: saisieVide(note) ? null : note.trim(),
        date: new Date().toISOString().slice(0, 10),
        par: "Gilles (application)",
      };
      base.maj_le = new Date().toISOString().slice(0, 16);
      base.regle = "Décisions prises à la main depuis l'application. Elles priment sur " +
                   "tout : ni HubSpot ni un avis d'attribution ne les écrasent.";

      await ecriture.ecrire(ecriture.fichier, JSON.stringify(base, null, 1),
        `${statut === "gagne" ? "Gagnée" : statut === "refuse" ? "Refusée" : "Perdue"} — ${ao.id}`);
      setEtat({ type: "ok", texte: "Enregistré. La prochaine veille en tiendra compte." });
      setOuvert(null);
      setMotif("");
      if (surEnregistrement) surEnregistrement(base.decisions[ao.id]);
    } catch (e) {
      setEtat({ type: "erreur", texte: String(e.message || e) });
    }
  }

  return (
    <Panel style={{ padding: 16, marginBottom: 14 }}>
      <SectionTitle>MARQUER LE RÉSULTAT</SectionTitle>
      {!ouvert && (
        <div style={{ display: "flex", gap: 10, flexWrap: "wrap", alignItems: "center" }}>
          <button style={bouton(T.go)} onClick={() => setOuvert("gagne")}>Affaire gagnée</button>
          <button style={bouton(T.steel)} onClick={() => setOuvert("perdu")}>Affaire perdue</button>
          {/* AFFAIRE REFUSÉE — demande de Gilles, 07/09 : « cela permettrait que les
              affaires que l'on ne souhaite pas ne passent pas dans les statistiques
              perdues alors qu'on en a juste pas voulu ». Une affaire qu'on n'a pas
              voulue n'est pas une affaire perdue : CGM n'a pas remis d'offre,
              personne ne l'a battue, et il n'y a aucun prix. Elle ne compte donc ni
              au taux de gain, ni chez « qui nous bat », ni dans la mémoire des prix. */}
          <button style={bouton(T.amber)} onClick={() => setOuvert("refuse")}>Affaire refusée</button>

/* ---------- Le résultat d'une affaire jouée (boucle gagné-perdu) ----------
   Quand un avis d'attribution nomme le gagnant d'un marché qu'on suivait, la

   le prix de marché — et la preuve du rapprochement, pour qu'un doute soit
   levable d'un coup d'œil. */
function Resultat({ ao }) {
  const r = ao.resultat;
  const [etat, setEtat] = React.useState(null);
  if (!r) return null;
  const sien = r.ferme_par === "décision de Gilles";
  async function rouvrir() {
    setEtat({ texte: "Réouverture…" });
    try {
      await retirerResultat(ao);
      setEtat({ texte: "Affaire rouverte. La prochaine veille la remettra au fil." });
    } catch (e) {
      setEtat({ texte: String(e.message || e), erreur: true });
    }
  }
  const gagne = r.statut === "gagne";
  const refuse = r.statut === "refuse";
  const euros = (v) => (v == null ? null : Math.round(v).toLocaleString("fr-FR") + " €");
  const preuve = r.preuve || {};

    <Panel style={{ padding: 16, marginBottom: 14,

                    borderColor: gagne ? T.go : refuse ? T.amber : T.line }}>

      <div style={{ fontSize: 14, color: T.ink }}>
        {gagne ? "Remportée par CGM"
               : refuse ? <>CGM n'y est pas allée{r.motif ? <> — {r.motif}</> : null}{r.note ? <> ({r.note})</> : null}</>
               : r.titulaire && !saisieVide(r.titulaire)
                   ? <>Remportée par <b>{r.titulaire}</b></>
                   : "Titulaire non connu — HubSpot ne dit pas qui a gagné"}
        {refuse ? null : r.montant_eur ? <> · <b>{euros(r.montant_eur)}</b></> : " · montant non publié"}
        {r.date ? <span style={{ color: T.steel }}> · {String(r.date).split("-").reverse().join("/")}</span> : null}
      </div>
      <div style={{ fontFamily: FM, fontSize: 10.5, color: T.steel, marginTop: 6 }}>
        Fermée par {r.ferme_par || "CGMTRACK"}
        {preuve.recouvrement != null
          ? <> — recouvrement de l'objet {Math.round(preuve.recouvrement * 100)} %
              {preuve.meme_dept ? ", même département" : ""}
              {preuve.meme_famille ? ", même famille" : ""}.</>
          : <> — source : {r.source}.</>}
        {r.url ? <> <a href={r.url} target="_blank" rel="noreferrer" style={{ color: T.blue }}>voir l'avis</a></> : null}
      </div>
      {refuse && (
        <div style={{ fontSize: 11.5, color: T.steel, marginTop: 6 }}>
          Ne compte pas comme une perte : ni au taux de gain, ni chez « qui nous bat »,
          ni dans la mémoire des prix.
        </div>
      )}
      {sien && (
        <div style={{ marginTop: 10, display: "flex", gap: 10, alignItems: "center", flexWrap: "wrap" }}>
          <button onClick={rouvrir}
            style={{ fontFamily: FM, fontSize: 12, padding: "6px 11px", borderRadius: 4,
                     border: `1px solid ${T.line}`, background: T.panel, color: T.steel,
                     cursor: "pointer" }}>
            Ce n'était pas ça — rouvrir l'affaire
          </button>
          <span style={{ fontSize: 11.5, color: etat && etat.erreur ? T.nogo : T.steel }}>
            {etat ? etat.texte
                  : "un essai ne doit pas devenir un fait : ceci retire la décision et remet l'affaire au fil."}
          </span>
        </div>
      )}
      {r.montant_eur ? (
        <div style={{ fontSize: 11.5, color: T.steel, marginTop: 4 }}>
          {r.montant_est ? r.montant_est + ". " : ""}
          Ce prix entre dans la mémoire du marché : c'est lui qui rendra le prix de marché

/* ---------- Questions au dossier (voie gratuite) ----------
   Recherche mot à mot dans le texte extrait des pièces (data/dce/<id>/texte.json,
   déposé par lecture_dce.py). Les passages sont cités TELS QUELS, avec la pièce
   d'où ils viennent — jamais de résumé, jamais de reformulation. La voie payante
   (question posée à Claude) viendra en option, désactivée par défaut. */
function QuestionsDossier({ ao }) {
  const { useState } = React;
  const [question, setQuestion] = useState("");
  const [resultats, setResultats] = useState(null);
  const [etat, setEtat] = useState("prêt");
  const normaliser = (t) => (t || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
  const VIDES = new Set(["les", "des", "une", "est", "sont", "dans", "pour", "avec", "sur", "par", "que", "qui", "quel", "quelle", "quels", "aux", "ces", "cette", "leur", "nous", "vous", "elle", "ils", "elles", "mais", "donc", "pas", "plus", "tout", "tous", "comment", "combien", "quand"]);

  async function chercher() {
    const mots = normaliser(question).split(/[^a-z0-9]+/).filter((m) => m.length >= 3 && !VIDES.has(m));
    if (!mots.length) { setResultats([]); return; }
    setEtat("recherche");
    let texte = null;
    try {
      const r = await fetch(`data/dce/${ao.id}/texte.json?t=` + Date.now(), { cache: "no-store" });
      if (r.ok) texte = await r.json();
    } catch (e) { /* dossier non lu */ }
    if (!texte || !texte.pieces || !texte.pieces.length) { setEtat("absent"); setResultats(null); return; }
    const passages = [];
    texte.pieces.forEach((p) => {
      (p.texte.match(/[^.!?\n]{15,300}[.!?]?/g) || []).forEach((phrase) => {
        const n = normaliser(phrase);
        const score = mots.filter((m) => n.includes(m)).length;
        if (score > 0) passages.push({ phrase: phrase.trim(), piece: p.nom, score });
      });
    });
    passages.sort((a, b) => b.score - a.score);
    setResultats(passages.slice(0, 5));
    setEtat("prêt");
  }

  return (
    <Panel style={{ padding: 20, marginBottom: 14 }}>
      <SectionTitle>QUESTIONS AU DOSSIER</SectionTitle>
      <div style={{ fontSize: 11.5, color: T.steel, marginBottom: 8 }}>
        Recherche mot à mot dans le texte extrait des pièces — gratuite, sans IA. Les passages sont cités tels quels, avec leur pièce d'origine.
      </div>
      <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
        <input value={question} onChange={(e) => setQuestion(e.target.value)}
          onKeyDown={(e) => e.key === "Enter" && chercher()}
          placeholder="Ex. : visite obligatoire, retenue de garantie, délai d'exécution…"
          style={{ flex: 1, minWidth: 220, padding: "8px 10px", border: `1px solid ${T.line}`, borderRadius: 5, fontSize: 13 }} />
        <button onClick={chercher} style={{ padding: "8px 16px", background: T.blue, color: "#fff", border: "none", borderRadius: 5, fontWeight: 600, cursor: "pointer", fontSize: 13 }}>Chercher</button>
      </div>
      {etat === "absent" && (
        <div style={{ marginTop: 10, fontSize: 12.5, color: T.amber, fontWeight: 600 }}>
          Le texte du dossier n'est pas disponible : pièces non retirées, illisibles sans OCR, ou dossier à retirer à la main.
        </div>
      )}
      {resultats && resultats.length === 0 && etat === "prêt" && (
        <div style={{ marginTop: 10, fontSize: 12.5, color: T.steel }}>
          Rien trouvé pour ces mots dans les pièces lues — essayer d'autres termes, ou ouvrir la pièce elle-même.
        </div>
      )}
      {resultats && resultats.length > 0 && resultats.map((r, i) => (
        <div key={i} style={{ marginTop: 10, background: "#F6F8F9", border: `1px solid ${T.line}`, borderRadius: 4, padding: "8px 11px" }}>
          <div style={{ fontFamily: FM, fontSize: 10, fontWeight: 700, color: T.steel, letterSpacing: "0.05em", marginBottom: 3 }}>{(r.piece || "").toUpperCase()}</div>
          <div style={{ fontSize: 12.5, color: T.ink, lineHeight: 1.5 }}>« {r.phrase} »</div>
        </div>
      ))}
    </Panel>
  );
}

/* DÉPOSER LE DOSSIER SOI-MÊME — demande de Gilles, 07/09 : « je télécharge le
   dossier, je le dépose, et lecture, chiffrage et checklist repartent seuls ».
   Cinq dossiers PLACE, deux captchas, deux avis sans profil acheteur : le robot ne
   passe pas partout. Or sans RC ni CCTP, aucun GO ne peut être validé (règle métier
   n° 8) — le blocage n'est donc pas un détail technique, il arrête la chaîne.
   Le jeton d'écriture de la page ne peut toucher QUE data/decisions.json, et ce
   garde-fou ne bouge pas : le dépôt d'un PDF passe donc par la page de dépôt du
   dépôt, en glisser-déposer. On donne un lien qui s'ouvre, jamais un chemin écrit
   en clair (leçon de la Bibliothèque, le matin même). */
function DeposerLeDossier({ ao }) {
  const ecriture = window.CGMTRACK_ECRITURE;
  const depot = ecriture && ecriture.depot;
  const lien = depot ? `https://github.com/${depot}/upload/main/data/dce/${ao.id}` : null;
  return (
    <div style={{ background: T.blueSoft, border: `1px solid ${T.blue}44`, borderRadius: 4,
                  padding: "10px 12px", fontSize: 12.5, color: T.ink, marginBottom: 10,
                  lineHeight: 1.6 }}>
      <b>Le robot n'y arrive pas ? Déposez le dossier vous-même.</b>
      <div style={{ marginTop: 3 }}>
        Téléchargez le RC et le CCTP depuis le profil acheteur (le bouton ci-dessus),
        puis déposez-les ici. <b>Tout le reste repart seul</b> au prochain passage :
        lecture du dossier, dossier de chiffrage pour le BE, checklist des pièces à
        fournir, questions à poser à l'acheteur.
      </div>
      <div style={{ marginTop: 6 }}>
        {lien
          ? <a href={lien} target="_blank" rel="noreferrer" style={{ ...styleBouton, display: "inline-block" }}>
              Déposer le dossier de {ao.id} →
            </a>
          : <span style={{ color: T.steel }}>Depuis la copie de bureau, un lien direct vous emmène au bon dossier.</span>}
      </div>
      <div style={{ fontSize: 11.5, color: T.steel, marginTop: 6 }}>
        Glissez vos fichiers dans la page qui s'ouvre, puis « Commit changes ». PDF, DOC
        ou ZIP. C'est le RC ou le CCTP qui compte — les annexes seules ne suffisent pas
        à valider un GO.
      </div>
    </div>
  );
}

function DocsDCE({ docs, ao }) {

  return (

      {docs.manuel && ao && <DeposerLeDossier ao={ao} />}
      {docs.alerte && (
        <div style={{ background: T.amberSoft, border: `1px solid ${T.amber}55`, borderRadius: 4, padding: "9px 12px", fontSize: 12.5, color: T.ink, marginBottom: 10 }}>
          <span style={{ fontFamily: FM, fontSize: 10, fontWeight: 700, color: T.amber, letterSpacing: "0.06em", marginRight: 8 }}>⚠ NOUVELLE VERSION DÉTECTÉE</span>
          {docs.alerte}
        </div>
      )}
      {pieces.map(([nom, ver, st, chemin], i) => {
        const url = lienPiece(chemin);
        return (
          <div key={i} style={{ display: "flex", justifyContent: "space-between", gap: 10, padding: "6px 0", borderTop: i > 0 ? `1px solid ${T.line}` : "none", flexWrap: "wrap", alignItems: "center" }}>
            <span style={{ fontSize: 13, color: T.ink }}>📄 {nom}{st === "new" && <Badge color={T.amber} soft={T.amberSoft}> MODIFIÉ</Badge>}</span>
            <span style={{ display: "flex", gap: 10, alignItems: "center" }}>
              <span style={{ fontFamily: FM, fontSize: 11, color: st === "new" ? T.amber : T.steel, fontWeight: st === "new" ? 700 : 400 }}>{ver}</span>
              {/* « OUVRIR » N'EXISTE QUE S'IL Y A QUELQUE CHOSE À OUVRIR — constat de
                  Gilles, 04/09 : « beaucoup de boutons ne débouchent sur rien, et
                  n'ouvrent rien ». Celui-ci était le cas d'école : quand la pièce
                  n'avait pas de chemin enregistré, la page affichait quand même un
                  bouton « Ouvrir », identique au vrai, et sans la moindre action
                  derrière. Un bouton qui ne peut rien faire ne doit pas exister :
                  on dit ce qui manque, à la place. */}
              {url
                ? <a href={url} target="_blank" rel="noreferrer" style={styleBouton}>Ouvrir</a>
                : <span style={{ fontFamily: FM, fontSize: 11, color: T.steel }}
                        title="Le fichier n'a pas été enregistré au dossier — il n'y a rien à ouvrir depuis la page.">
                    pièce non déposée
                  </span>}
            </span>
          </div>
        );
      })}
      {pieces.length === 0 && !docs.manuel && (
        <div style={{ fontSize: 12.5, color: T.steel, padding: "6px 0" }}>Aucune pièce remontée pour l'instant.</div>
      )}
      {docs.qr && (
        <div style={{ marginTop: 10, background: T.blueSoft, border: `1px solid ${T.blue}30`, borderRadius: 4, padding: "8px 11px", fontSize: 12.5, color: T.ink }}>
          <span style={{ fontFamily: FM, fontSize: 10, fontWeight: 700, color: T.blue, letterSpacing: "0.06em", marginRight: 8 }}>QUESTIONS / RÉPONSES SUIVIES</span>
          {docs.qr}
        </div>
      )}
      <div style={{ fontSize: 11.5, color: T.steel, marginTop: 8 }}>
        {docs.manuel
          ? "Cette plateforme demande un compte : le dossier se retire à la main. Le robot repasse chaque matin et prendra le relais dès que les pièces deviennent accessibles."
          : docs.identifie
          ? "Dossier retiré au nom de CGM auprès de l'acheteur : la plateforme adresse désormais directement les modifications d'indice et les réponses aux questions. Le robot vérifie en plus chaque matin et signale toute pièce nouvelle ou modifiée."
          : "Le robot surveille le profil acheteur : nouvelle pièce, indice modifié, réponse aux questions ou report de date = alerte immédiate + relance de l'analyse IA sur la nouvelle version."}
      </div>
    </Panel>
  );
}

            <div style={{ position: "absolute", top: 0, left: "50%", transform: "translateX(-50%)", width: 13, height: 13, borderRadius: "50%", background: T.blue, border: "2px solid #fff", boxShadow: `0 0 0 1px ${T.blue}` }} />

      </div>
