/* Courrier pré-rempli depuis ce que le dossier a livré : quantitatifs, fenêtre de
   chantier, et le bon angle selon qu'on répond en direct ou qu'on se place chez le
   titulaire. Rien n'est envoyé automatiquement — la messagerie s'ouvre, vous relisez. */
function lienMail(ao) {
  const dce = ao.dce || {}, chantier = ao.chantier || {}, position = ao.positionnement || {};
  const sousTraitance = position.posture && position.posture !== "directe";
  const metier = (FAM_COURT[ao.famille] || ao.famille || "").toLowerCase();
  const objet = sousTraitance
    ? `Sous-traitance ${metier} — ${(ao.titre || "").slice(0, 70)}`
    : `${ao.id} — ${(ao.titre || "").slice(0, 70)}`;

  const lignes = ["Madame, Monsieur,", ""];
  lignes.push(sousTraitance
    ? `Nous avons relevé la consultation « ${ao.titre} » (${ao.donneur || "acheteur public"}). `
      + `CGM, préfabricateur industriel à Irigny (69), se tient à votre disposition pour le lot ${metier} `
      + `si vous êtes candidat ou attributaire de cette opération.`
    : `Nous avons pris connaissance de la consultation « ${ao.titre} » (${ao.donneur || "acheteur public"}) `
      + `et souhaitons vous confirmer notre intention de remettre une offre.`);
  lignes.push("");
  if (dce.quantites && !/non trouv/i.test(dce.quantites)) {
    lignes.push(`Quantitatifs relevés au dossier : ${dce.quantites}.`);
  }
  const jalons = chantier.jalons || [];
  if (jalons.length) {
    lignes.push(`Calendrier retenu : ${jalons.map(([l, d]) => `${l} ${d}`).join(" · ")}.`);
  }
  if (dce.visite && /obligatoire/i.test(dce.visite)) {
    lignes.push(`Nous notons la visite de site obligatoire (${dce.visite.replace(/^Obligatoire\s*—?\s*/i, "")}).`);
  }
  lignes.push("");
  lignes.push(sousTraitance
    ? "Nous fabriquons en atelier et livrons dans toute la France ; nous pouvons vous adresser un prix "
      + "budgétaire sous 48 heures à partir de vos quantitatifs."
    : "Nous restons à votre disposition pour toute précision sur les pièces attendues.");
  lignes.push("");
  lignes.push("Bien cordialement,");
  lignes.push("Gilles FRANCO — Directeur Commercial Europe");
  lignes.push("CGM — Irigny (69)");

  return `mailto:?subject=${encodeURIComponent(objet)}&body=${encodeURIComponent(lignes.join("\n"))}`;
}

function Fiche({ ao, onBack, depts, pays }) {
  const [scores, setScores] = useState(ao.scores);
  const [goValide, setGoValide] = useState(false);
  /* Règle CGM : aucun GO ne se valide sans le dossier. Il faut au minimum le RC
     ou le CCTP au dossier ; à défaut, la validation reste fermée tant que Gilles
     n'a pas confirmé avoir le dossier en main (retrait fait sur le profil). */
  const [dossierEnMain, setDossierEnMain] = useState(false);
  const piecesDce = (ao.docs && ao.docs.pieces) || [];
  const pieceCle = piecesDce.some((p) => /^(RC|CCTP)/.test(p[0] || ""));
  const dossierPret = pieceCle || dossierEnMain;
  const profilAcheteur = (ao.docs && ao.docs.profil) || ao.url;
  const score = calcScore(scores);
  const hp = hpEffectif(ao, depts, pays);
  const v = verdict(score, !!hp);

  // Plan de charge : montré pour une affaire jouée en direct, en périmètre.
  const chargeVisible = !hp && ao.positionnement && ao.positionnement.posture === "directe";

  return (
    <div>
      <button onClick={onBack} style={{ fontFamily: FM, fontSize: 12, color: T.blue, background: "none", border: "none", cursor: "pointer", padding: 0, marginBottom: 14 }}>← Retour au fil d'alertes</button>

      <Panel style={{ padding: 20, marginBottom: 14 }}>
        <div style={{ display: "flex", gap: 8, alignItems: "center", marginBottom: 8, flexWrap: "wrap" }}>
          <span style={{ fontFamily: FM, fontSize: 12, color: T.steel }}>{ao.id}</span>
          <Badge color={T.blue} soft={T.blueSoft}>{ao.source}</Badge>
          <FamilleBadge famille={ao.famille} />
          <span>{PAYS_FLAG[ao.pays]}{ao.dept && <span style={{ fontFamily: FM, fontSize: 12, color: T.steel }}> dépt {ao.dept}</span>}</span>
          <span style={{ fontFamily: FM, fontSize: 12, color: joursRestants(ao) <= 10 ? T.nogo : T.steel }}>Échéance J−{joursRestants(ao)}</span>
        </div>
        <h2 style={{ fontFamily: FD, fontWeight: 700, fontSize: 19, color: T.ink, margin: 0, lineHeight: 1.3 }}>{ao.titre}</h2>
        <div style={{ fontSize: 13, color: T.steel, marginTop: 6 }}>{ao.donneur} · {ao.montant}</div>

        <div style={{ marginTop: 14, background: T.blueSoft, border: `1px solid ${T.blue}30`, borderRadius: 5, padding: "10px 13px" }}>
          <SectionTitle><span style={{ color: T.blue }}>ANALYSE IA DU DCE</span></SectionTitle>
          <div style={{ fontSize: 13, color: T.ink, lineHeight: 1.5 }}>{ao.ia}</div>
        </div>
        {hp && (
          <div style={{ marginTop: 10, background: T.nogoSoft, border: `1px solid ${T.nogo}55`, borderRadius: 5, padding: "10px 13px", fontSize: 13, color: T.nogo, fontWeight: 600 }}>⛔ Règle de périmètre : {hp}</div>
        )}
      </Panel>

      {/* Positionnement : réponse directe ou sous-traitance du titulaire */}
      {ao.positionnement && (
        <Panel style={{ padding: 20, marginBottom: 14, borderLeft: `4px solid ${POSTURE[ao.positionnement.posture] ? POSTURE[ao.positionnement.posture].c : T.amber}` }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", flexWrap: "wrap", gap: 6 }}>
            <SectionTitle>COMMENT JOUER CETTE AFFAIRE</SectionTitle>
            <span style={{ fontFamily: FD, fontWeight: 700, fontSize: 15, color: (POSTURE[ao.positionnement.posture] || POSTURE["sous-traitance"]).c }}>
              {(POSTURE[ao.positionnement.posture] || POSTURE["sous-traitance"]).titre}
            </span>
          </div>
          <div style={{ fontSize: 13, color: T.ink, lineHeight: 1.5 }}>{ao.positionnement.motif}</div>
          {ao.positionnement.posture !== "directe" && (
            <div style={{ fontSize: 12.5, color: T.steel, marginTop: 6 }}>
              {(POSTURE[ao.positionnement.posture] || POSTURE["sous-traitance"]).explication}
            </div>
          )}
          {ao.positionnement.alertes.map((a, i) => (
            <div key={i} style={{ marginTop: 8, background: T.amberSoft, border: `1px solid ${T.amber}44`, borderRadius: 4, padding: "8px 11px", fontSize: 12.5, color: T.ink }}>
              ⚠ {a}
            </div>
          ))}
        </Panel>
      )}

      {/* Extraction DCE */}
      {ao.dce && (
        <Panel style={{ padding: 20, marginBottom: 14 }}>
          <SectionTitle>EXTRACTION AUTOMATIQUE DU DCE</SectionTitle>
          <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(220px, 1fr))", gap: 10, marginBottom: 12 }}>
            {[
              ["Critères de jugement", ao.dce.criteres],
              ["Visite de site", ao.dce.visite],
              ["Caution / garantie", ao.dce.caution],
              ["Quantitatifs clés", ao.dce.quantites],
            ].map(([l, val]) => (
              <div key={l} style={{ background: "#F6F8F9", border: `1px solid ${T.line}`, borderRadius: 4, padding: "8px 10px" }}>
                <div style={{ fontFamily: FM, fontSize: 10, fontWeight: 700, color: T.steel, letterSpacing: "0.06em", marginBottom: 3 }}>{l.toUpperCase()}</div>
                <div style={{ fontSize: 12.5, color: T.ink, lineHeight: 1.4 }}>{val}</div>
              </div>
            ))}
          </div>
          {ao.dce.alertes.map((a, i) => (
            <div key={i} style={{ fontSize: 12.5, color: T.amber, fontWeight: 600, marginBottom: 3 }}>⚠ {a}</div>
          ))}
          <div style={{ marginTop: 10 }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", flexWrap: "wrap", gap: 6 }}>
              <SectionTitle>CHECKLIST PIÈCES — PRÉ-REMPLIE DEPUIS LE RC</SectionTitle>
              {ao.checklist_resume && (
                <span style={{ fontFamily: FM, fontSize: 11, color: T.steel }}>{ao.checklist_resume}</span>
              )}
            </div>
            {ao.checklist_alerte && (
              <div style={{ background: T.nogoSoft, border: `1px solid ${T.nogo}55`, borderRadius: 4, padding: "8px 11px", fontSize: 12.5, color: T.nogo, fontWeight: 600, marginBottom: 8 }}>
                ⛔ {ao.checklist_alerte}
              </div>
            )}
            {ao.checklist ? ao.checklist.map(([piece, statut, detail], i) => {
              const e = ETAT_CHECKLIST[statut] || ETAT_CHECKLIST.a_verifier;
              return (
                <div key={i} style={{ display: "flex", justifyContent: "space-between", gap: 10, padding: "5px 0", borderTop: i > 0 ? `1px solid ${T.line}` : "none", flexWrap: "wrap", alignItems: "center" }}>
                  <span style={{ fontSize: 13, color: T.ink }}>{e.mot} {piece}</span>
                  <span style={{ fontFamily: FM, fontSize: 11, color: e.c, fontWeight: statut === "bloquante" ? 700 : 400, textAlign: "right" }}>{detail}</span>
                </div>
              );
            }) : ao.dce.pieces.map((p, i) => (
              <label key={i} style={{ display: "flex", gap: 8, alignItems: "center", fontSize: 13, color: T.ink, padding: "4px 0", cursor: "pointer" }}>
                <input type="checkbox" style={{ accentColor: T.go }} /> {p}
              </label>
            ))}
          </div>
        </Panel>
      )}

      <DocsDCE docs={ao.docs} ao={ao} />

      <QuestionsDossier ao={ao} />

      <ArbitragePerimetre ao={ao} />

      <MarquerResultat ao={ao} surEnregistrement={(d) => {
        ao.resultat = { statut: d.statut,
                        titulaire: d.statut === "refuse" ? null
                                   : d.titulaire || (d.statut === "gagne" ? "CGM" : null),
                        montant_eur: d.montant_eur, date: d.date, note: d.note,
                        source: "décision prise dans l'application",
                        ferme_par: "décision de Gilles" };
        /* La fiche quitte le fil à l'instant même : sans ce redessin, elle reste
           affichée et on croit que rien ne s'est passé. C'est exactement ce qu'a
           vécu Gilles le 02/09. */
        if (window.CGMTRACK_REDESSINE) window.CGMTRACK_REDESSINE();
      }} />
      <Resultat ao={ao} />
      <DeuxVues ao={ao} />

      <FicheChantier ch={ao.chantier} />

      {/* Plan de charge réel : ce que l'affaire représente pour l'atelier */}
      {chargeVisible && <ChargeAtelier focus={{ atelier: ao.atelier }} />}

      {/* Verdict */}
      <div style={{ background: v.soft, border: `1px solid ${v.color}55`, borderRadius: 6, padding: 20, marginBottom: 14 }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", flexWrap: "wrap", gap: 8, marginBottom: 12 }}>
          <div>
            <span style={{ fontFamily: FD, fontWeight: 800, fontSize: 30, color: v.color, letterSpacing: "0.02em" }}>{v.label}</span>
            <span style={{ fontSize: 13, color: T.ink, marginLeft: 12 }}>{v.detail}</span>
          </div>
          <span style={{ fontFamily: FM, fontWeight: 700, fontSize: 24, color: T.ink }}>{score}<span style={{ fontSize: 13, color: T.steel, fontWeight: 400 }}> / 85 · seuil GO 45</span></span>
        </div>
        <Gauge score={score} />
      </div>

      {/* Grille */}
      <Panel style={{ padding: 20, marginBottom: 14 }}>
        <SectionTitle>GRILLE DE SCORING — AJUSTABLE</SectionTitle>
        <div style={{ fontSize: 12.5, color: T.steel, marginBottom: 14 }}>L'IA pré-remplit chaque critère à la lecture du DCE. Corrigez si nécessaire : le verdict se recalcule en direct.</div>
        {CRITERES.map((c, i) => (
          <div key={c.id} style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 12, padding: "10px 0", borderTop: i > 0 ? `1px solid ${T.line}` : "none", flexWrap: "wrap" }}>
            <div style={{ flex: "1 1 200px" }}>
              <span style={{ fontSize: 13.5, fontWeight: 600, color: T.ink }}>{c.label}</span>
              <span style={{ fontFamily: FM, fontSize: 11, color: T.steel, marginLeft: 8 }}>×{c.poids}</span>
            </div>
            <div style={{ display: "flex", gap: 5 }}>
              {[1, 3, 5].map((val, idx) => {
                const actif = scores[c.id] === val;
                return (
                  <button key={val} onClick={() => setScores((s) => ({ ...s, [c.id]: val }))} title={c.niveaux[idx]}
                    style={{ fontFamily: FM, fontSize: 12, minWidth: 34, padding: "5px 8px", borderRadius: 4, cursor: "pointer", border: `1px solid ${actif ? T.blue : T.line}`, background: actif ? T.blue : T.panel, color: actif ? "#fff" : T.steel, fontWeight: actif ? 700 : 400 }}>
                    {val}
                  </button>
                );
              })}
              <span style={{ fontFamily: FM, fontSize: 12, color: T.ink, fontWeight: 700, minWidth: 30, textAlign: "right", alignSelf: "center" }}>{c.poids * (scores[c.id] || 1)}</span>
            </div>
            <div style={{ flexBasis: "100%", fontSize: 11.5, color: T.steel, marginTop: 2 }}>{c.niveaux[[1, 3, 5].indexOf(scores[c.id])]}</div>
          </div>
        ))}
      </Panel>

      {/* Actions + rétro-planning simulé */}
      <Panel style={{ padding: 20 }}>
        {!goValide ? (
          <div>
            {score >= 45 && !hp && !dossierPret && (
              <div style={{ background: T.amberSoft, border: `1px solid ${T.amber}55`, borderRadius: 5, padding: "11px 13px", marginBottom: 12 }}>
                <div style={{ fontFamily: FM, fontSize: 10, fontWeight: 700, color: T.amber, letterSpacing: "0.06em", marginBottom: 4 }}>DOSSIER NON RETIRÉ</div>
                <div style={{ fontSize: 13, color: T.ink, lineHeight: 1.5 }}>
                  Ni le RC ni le CCTP ne sont au dossier. Un GO ne se valide pas sans avoir lu
                  les pièces : c'est là que se trouvent les critères de jugement, les quantitatifs
                  et la fenêtre de chantier.
                </div>
                <div style={{ display: "flex", gap: 10, flexWrap: "wrap", marginTop: 9 }}>
                  {profilAcheteur && (
                    <a href={profilAcheteur} target="_blank" rel="noreferrer" style={{ ...styleBouton, padding: "7px 12px", fontSize: 12 }}>Ouvrir le profil acheteur →</a>
                  )}
                  <button onClick={() => setDossierEnMain(true)} style={{ ...styleBouton, padding: "7px 12px", fontSize: 12, color: T.ink }}>
                    J'ai le dossier en main — débloquer la validation
                  </button>
                </div>
              </div>
            )}
            <div style={{ display: "flex", gap: 10, flexWrap: "wrap" }}>
              {/* Ce bouton disait « Archiver (No Go) » et ne faisait RIEN : Gilles cliquait,
                  la fiche restait. 01/09 — il renvoie maintenant vers le seul geste qui
                  l'enregistre vraiment, en haut de la fiche. Un bouton qui n'agit pas ne
                  doit pas porter un verbe d'action. */}
              <button disabled={!!hp || (score >= 45 && !dossierPret)}
                onClick={() => {
                  if (score >= 45 && dossierPret) { setGoValide(true); return; }
                  const p = document.getElementById("arbitrage-" + ao.id);
                  if (p) p.scrollIntoView({ behavior: "smooth", block: "center" });
                }}
                style={{ fontFamily: FD, fontWeight: 700, fontSize: 13.5, padding: "10px 18px", borderRadius: 5, border: "none", cursor: hp || (score >= 45 && !dossierPret) ? "not-allowed" : "pointer", background: v.color, color: "#fff", opacity: hp || (score >= 45 && !dossierPret) ? 0.5 : 1 }}>
                {hp ? "Exclu par règle — archivé"
                  : score >= 45 ? (dossierPret ? "Valider le GO → générer le rétro-planning" : "GO en attente du DCE")
                  : "Sortir du tableau ↑"}
              </button>
              {/* TROISIÈME BOUTON MORT — trouvé le 04/09 en cherchant les deux autres.
                  Sans adresse d'avis, il s'intitulait « Télécharger le DCE » et son
                  action était « ao.url && … », c'est-à-dire rien. Il promettait donc
                  un téléchargement qu'il ne pouvait pas faire. Quand il n'y a pas
                  d'adresse, il n'y a pas de bouton : la page dit ce qui manque. */}
              {ao.url
                ? <button onClick={() => window.open(ao.url, "_blank")} style={{ fontFamily: FB, fontSize: 13.5, padding: "10px 18px", borderRadius: 5, border: `1px solid ${T.line}`, cursor: "pointer", background: T.panel, color: T.ink }}>Ouvrir l'avis officiel</button>
                : <span style={{ fontFamily: FM, fontSize: 12, color: T.steel, alignSelf: "center" }}>
                    cet avis ne publie pas d'adresse : le dossier se retire depuis le profil acheteur
                  </span>}
              <a href={lienMail(ao)} style={{ fontFamily: FB, fontSize: 13.5, padding: "10px 18px", borderRadius: 5, border: `1px solid ${T.line}`, cursor: "pointer", background: T.panel, color: T.ink, textDecoration: "none" }}>
                {!ao.positionnement || ao.positionnement.posture === "directe" ? "Écrire à l'acheteur"

                  : "Écrire au titulaire"}
              </a>
            </div>
          </div>
        ) : (
          <div>
            <div style={{ fontSize: 13.5, fontWeight: 700, color: T.go, marginBottom: 10 }}>✓ GO validé — rétro-planning généré, jalons poussés dans l'agenda, dossier créé dans HubSpot (pipeline AO)</div>
            <SectionTitle>RÉTRO-PLANNING AUTOMATIQUE</SectionTitle>
            {[
              ["Visite de site / questions au DCE", `J−${Math.max(joursRestants(ao) - 3, 2)}`],
              ["Chiffrage + consultations fournisseurs", `J−${Math.max(joursRestants(ao) - 8, 4)}`],
              ["Mémoire technique (blocs bibliothèque pré-chargés)", "J−5"],
              ["Relecture + checklist administrative", "J−3"],
              ["Dépôt sur la plateforme", "J−1"],
            ].map(([j, d], i) => (
              <div key={i} style={{ display: "flex", gap: 10, alignItems: "center", padding: "6px 0", borderTop: i > 0 ? `1px dashed ${T.line}` : "none" }}>
                <span style={{ fontFamily: FM, fontSize: 11.5, color: T.blue, fontWeight: 700, minWidth: 44 }}>{d}</span>
                <span style={{ fontSize: 13, color: T.ink }}>{j}</span>
              </div>
            ))}
          </div>
        )}
      </Panel>
    </div>
  );
}

/* ---------- Pipeline (rétro-plannings) ---------- */
/* TROIS AFFAIRES QUI N'EXISTAIENT PAS — audit demandé par Gilles, 08/09 : « merci de
   vérifier qu'il n'y ait aucun faux dossier, ou inventé, nous devons être justes dans
   notre suivi ». Cet onglet affichait AO-2026-0345 « Tuyauterie inox — pharma Dijon »,
   AO-2026-0349 « Gaines — hospital de Gerona » et AO-2026-0341 « Skid biomasse
   2,4 MW », avec leurs jalons, leurs dates et un retard de quatre jours. Aucune de ces
   affaires n'existe. Pire : l'encadré rouge affirmait « relance envoyée » — or CGMTRACK
   n'envoie JAMAIS rien, c'est Gilles qui envoie.
   Le rétro-planning se calcule désormais à rebours depuis la VRAIE échéance de remise.
   Aucun jalon n'est déclaré « fait » : CGMTRACK ne sait pas ce que Gilles a déjà fait,
   et le supposer serait encore inventer. */

/* Les étapes d'une réponse, comptées en jours AVANT la remise. Ce n'est pas une donnée
   mais la méthode de travail de CGM : elle vaut pour toutes les affaires. */
const ETAPES_REPONSE = [
  { j: "Retirer le dossier (RC, CCTP)", avant: 25 },
  { j: "Lecture et questions à l'acheteur", avant: 20 },
  { j: "Demande de chiffrage au BE", avant: 15 },
  { j: "Retour du BE et arbitrage prix", avant: 7 },
  { j: "Mémoire technique et pièces", avant: 4 },
  { j: "Dépôt sur la plateforme", avant: 1 },
];

function Pipeline() {
  /* On ne planifie que ce qui est vivant, dans le périmètre, en zone GO et pas encore
     tranché : planifier une affaire refusée n'aurait aucun sens. */
  const suivies = CONSULTATIONS
    .filter((c) => !c.horsPerimetre && !c.amont && !(c.resultat || {}).statut
                   && !c.ecartee_a_la_main && typeof joursRestants(c) === "number"
                   && joursRestants(c) > 0 && calcScore(c.scores || {}) >= 45)
    .sort((a, b) => joursRestants(a) - joursRestants(b));

  const dans = (jours) => {
    const d = new Date(Date.now() + jours * 86400000);
    return `${String(d.getDate()).padStart(2, "0")}/${String(d.getMonth() + 1).padStart(2, "0")}`;
  };

  return (
    <div>
      <Panel style={{ marginBottom: 14 }}>
        <div style={{ fontSize: 13.5, color: T.ink, lineHeight: 1.55 }}>
          Le rétro-planning se calcule <b>à rebours depuis la date limite de remise</b> de
          chaque affaire en zone GO. Les jalons sont des <b>repères</b>, pas un suivi :
          CGMTRACK ne sait pas ce que vous avez déjà fait et ne le suppose pas. Il n'envoie
          rien non plus — les relances se préparent, c'est vous qui envoyez.
        </div>
      </Panel>
      {!suivies.length && (
        <Panel>
          <div style={{ fontSize: 12.5, color: T.steel, lineHeight: 1.6 }}>
            Aucune affaire à planifier aujourd'hui : il faut une consultation en zone GO
            (score ≥ 45), dans le périmètre, encore ouverte, et dont l'échéance n'est pas
            passée. Le rétro-planning apparaîtra tout seul dès qu'une affaire remplira ces
            conditions.
          </div>
        </Panel>
      )}
      <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
        {suivies.map((c) => {
          const reste = joursRestants(c);
          const etapes = ETAPES_REPONSE.filter((e) => e.avant <= reste);
          const perdues = ETAPES_REPONSE.length - etapes.length;
          return (
            <Panel key={c.id} style={{ borderLeft: `4px solid ${perdues ? T.amber : T.blue}` }}>
              <div style={{ display: "flex", justifyContent: "space-between", gap: 8, flexWrap: "wrap", marginBottom: 10 }}>
                <div style={{ display: "flex", gap: 8, alignItems: "center", flexWrap: "wrap" }}>
                  <span style={{ fontFamily: FM, fontSize: 11, color: T.steel }}>{c.id}</span>
                  <FamilleBadge famille={c.famille} />
                  <span style={{ fontWeight: 700, fontSize: 14, color: T.ink }}>{c.titre}</span>
                </div>
                <span style={{ fontFamily: FM, fontSize: 12, fontWeight: 700, color: perdues ? T.amber : T.ink }}>
                  Remise dans {reste} j · {dans(reste)}
                </span>
              </div>
              <div style={{ display: "flex", gap: 0, flexWrap: "wrap" }}>
                {etapes.map((e, i) => (
                  <div key={i} style={{ flex: "1 1 120px", minWidth: 110, position: "relative", paddingTop: 14 }}>
                    <div style={{ position: "absolute", top: 5, left: 0, right: 0, height: 3, background: i === 0 ? "transparent" : "#E1E6EA" }} />
                    <div style={{ position: "absolute", top: 0, left: "50%", transform: "translateX(-50%)", width: 13, height: 13, borderRadius: "50%", background: T.steel, border: "2px solid #fff", boxShadow: `0 0 0 1px ${T.steel}` }} />
                    <div style={{ textAlign: "center", marginTop: 4 }}>
                      <div style={{ fontFamily: FM, fontSize: 10.5, color: T.steel, fontWeight: 700 }}>{dans(reste - e.avant)}</div>
                      <div style={{ fontSize: 11.5, color: T.ink, lineHeight: 1.3, marginTop: 2 }}>{e.j}</div>
                    </div>
                  </div>
                ))}
              </div>
              {perdues > 0 && (
                <div style={{ marginTop: 10, background: T.amberSoft, border: `1px solid ${T.amber}44`, borderRadius: 4, padding: "7px 10px", fontSize: 12.5, color: T.ink }}>
                  Délai serré : {perdues} étape(s) ne tiennent plus dans le temps restant.
                  À raccourcir, ou à décider vite.
                </div>
              )}
              {(c.docs || {}).manuel && (
                <div style={{ marginTop: 8, fontSize: 12, color: T.amber }}>
                  ⚠ Le dossier n'est pas encore au complet — c'est la première étape, et
                  aucun GO ne se valide sans le RC ou le CCTP.
                </div>
              )}
            </Panel>
          );
        })}
      </div>
    </div>
  );
}

/* ---------- Bibliothèque ---------- */
/* Statuts d'une ligne de checklist de réponse. */
const ETAT_CHECKLIST = {
  prete: { c: T.go, mot: "✓" },
  alerte: { c: T.amber, mot: "⚠" },
  bloquante: { c: T.nogo, mot: "⛔" },
  manquante: { c: T.nogo, mot: "⛔" },
  blocs: { c: T.blue, mot: "◐" },
  a_completer: { c: T.blue, mot: "○" },
  a_produire: { c: T.steel, mot: "○" },
  a_verifier: { c: T.steel, mot: "?" },
};

/* Couleur et libellé de chaque statut de pièce administrative. */
const ETAT_PIECE = {
  valide: { c: T.go, s: T.goSoft, mot: "✓" },
  permanente: { c: T.go, s: T.goSoft, mot: "✓" },
  expire_bientot: { c: T.amber, s: T.amberSoft, mot: "⚠" },
  perimee: { c: T.nogo, s: T.nogoSoft, mot: "⛔" },
  a_renseigner: { c: T.steel, s: "#EEF1F3", mot: "○" },
  absente: { c: T.steel, s: "#EEF1F3", mot: "—" },
};
/* UN SEUL JALON NE DOIT PAS FAIRE TOMBER LA PAGE — trouvé le 14/09, en testant la
   lecture du premier vrai DCE (Crous Grenoble Alpes).
   La carte affichait « jalons[jalons.length - 2] ». Avec UN jalon, l'indice vaut
   −1, la case est vide, et lire son premier élément arrête tout le rendu :
   « Cannot read properties of undefined ». Or un dossier fraîchement lu porte
   exactement UN jalon — la remise des offres. Personne ne l'avait vu parce
   qu'aucune fiche n'avait encore de chantier : le défaut attendait le premier
   dossier lu pour se déclencher, c'est-à-dire le jour où ça commence à marcher.
   On prend donc le dernier jalon À VENIR, et rien du tout s'il n'y en a pas. */
function prochainJalon(c) {
  const jalons = ((c || {}).chantier || {}).jalons || [];
  if (!jalons.length) return null;
  const j = jalons[Math.max(0, jalons.length - 2)];
  return Array.isArray(j) && j.length >= 2 ? j : null;
}

const dateFr = (valeur) => {
  const p = String(valeur || "").slice(0, 10).split("-");
  return p.length === 3 ? `${p[2]}/${p[1]}/${p[0]}` : valeur || "";
};

/* Une ligne de pièce administrative, et le formulaire qui la renseigne.
   C'est ce qui manquait : la page réclamait le Kbis sans offrir nulle part où le
   dire. La date saisie ici part dans data/decisions.json et prime sur admin.json. */
function LignePiece({ p, saisie, premiere, surSaisie }) {
  const { useState } = React;
  const [ouvert, setOuvert] = useState(false);
  const [le, setLe] = useState("");
  const [etat, setEtat] = useState(null);
  const ecriture = window.CGMTRACK_ECRITURE;
  const modifiable = !!(ecriture && ecriture.possible());
  const etatP = ETAT_PIECE[p.statut] || (p.ok ? ETAT_PIECE.valide : ETAT_PIECE.perimee);
  const champ = { padding: "6px 8px", border: `1px solid ${T.line}`, borderRadius: 4,
                  fontFamily: FM, fontSize: 13 };
  const bt = (fond, texte) => ({ padding: "5px 11px", background: fond, color: texte || "#fff",
                                 border: fond === "#fff" ? `1px solid ${T.line}` : "none",
                                 borderRadius: 4, fontWeight: 600, fontSize: 12, cursor: "pointer" });

  async function enregistrer(valeur, libelle) {
    setEtat({ type: "encours", texte: "Enregistrement…" });
    try {
      await ecrirePiece(p.piece, valeur);
      setEtat({ type: "ok", texte: libelle });
      setOuvert(false);
      if (surSaisie) surSaisie(p.piece, valeur);
    } catch (e) { setEtat({ type: "erreur", texte: String(e.message || e) }); }
  }

  return (
    <div style={{ padding: "7px 0", borderTop: premiere ? "none" : `1px solid ${T.line}` }}>
      <div style={{ display: "flex", justifyContent: "space-between", gap: 10, flexWrap: "wrap", alignItems: "center" }}>
        <span style={{ fontSize: 13, color: T.ink, fontWeight: 600 }}>{etatP.mot} {p.piece}</span>
        <span style={{ display: "flex", gap: 10, alignItems: "center", flexWrap: "wrap" }}>
          <span style={{ fontFamily: FM, fontSize: 12, color: etatP.c, fontWeight: p.ok ? 400 : 700 }}>
            {p.statut === "absente" ? "non détenue par CGM"
              : p.statut === "a_renseigner" ? "date non renseignée"
              : p.statut === "permanente" ? "sans date d'expiration"
              : p.jours < 0 ? `périmée depuis ${-p.jours} j (${dateFr(p.expire)}) — RENOUVELER`
              : `expire le ${dateFr(p.expire)} · J−${p.jours}${p.statut === "expire_bientot" ? " — RENOUVELER" : ""}`}
          </span>
          {modifiable && !ouvert && (
            <button style={bt("#fff", T.blue)} onClick={() => { setOuvert(true); setEtat(null); setLe(p.expire || ""); }}>
              {saisie ? "Modifier" : "Renseigner"}
            </button>
          )}
        </span>
      </div>
      {saisie && !ouvert && (
        <div style={{ fontSize: 11.5, color: T.steel, marginTop: 2 }}>
          Renseignée par vous le {dateFr(saisie.date)}{saisie.note ? ` — ${saisie.note}` : ""}
        </div>
      )}
      {ouvert && (
        <div style={{ marginTop: 8, background: "#F6F8F9", border: `1px solid ${T.line}`,
                      borderRadius: 5, padding: "10px 12px", maxWidth: 520 }}>
          <div style={{ fontSize: 12.5, color: T.ink, marginBottom: 7 }}>
            Jusqu'à quelle date cette pièce est-elle valable ?
            {p.emetteur ? <span style={{ color: T.steel }}> — délivrée par {p.emetteur}.</span> : null}
          </div>
          <div style={{ display: "flex", gap: 8, flexWrap: "wrap", alignItems: "center" }}>
            <input type="date" value={le} onChange={(e) => setLe(e.target.value)} style={champ} />
            <button style={bt(T.go)} disabled={!le}
              onClick={() => enregistrer({ expire: le, possede: true, date: new Date().toISOString().slice(0, 10),
                                           par: "Gilles (application)" },
                                         "Enregistré. L'alerte J−30 partira toute seule.")}>
              Enregistrer
            </button>
          </div>
          <div style={{ display: "flex", gap: 8, marginTop: 9, flexWrap: "wrap" }}>
            <button style={bt("#fff", T.steel)}
              onClick={() => enregistrer({ possede: false, date: new Date().toISOString().slice(0, 10),
                                           note: "CGM ne détient pas cette pièce",
                                           par: "Gilles (application)" },
                                         "Noté : CGM ne détient pas cette pièce.")}>
              CGM ne l'a pas
            </button>
            {saisie && (
              <button style={bt("#fff", T.steel)}
                onClick={() => enregistrer(null, "Saisie retirée : la pièce redevient à renseigner.")}>
                Effacer ma saisie
              </button>
            )}
            <button style={bt("#fff", T.steel)} onClick={() => { setOuvert(false); setEtat(null); }}>Annuler</button>
          </div>
          <div style={{ fontSize: 11.5, color: T.steel, marginTop: 8, lineHeight: 1.5 }}>
            La date suffit pour que CGMTRACK vous prévienne 30 jours avant l'expiration et
            coche la pièce dans les checklists de réponse. Le PDF lui-même se dépose à part
            (voir l'encadré en haut) — il n'est pas obligatoire pour l'alerte.
          </div>
        </div>
      )}
      {etat && (
        <div style={{ fontSize: 12, marginTop: 5,
                      color: etat.type === "erreur" ? T.nogo : etat.type === "ok" ? T.go : T.steel }}>
          {etat.texte}
        </div>
      )}
    </div>
  );
}

/* Où déposer les FICHIERS eux-mêmes. Un chemin de dépôt écrit en clair ne sert à

      <b>Où ranger le Kbis, les assurances et les autres pièces ?</b>
      <div style={{ marginTop: 4 }}>
        <b>1 · La date</b> se saisit ici même, ligne par ligne, avec le bouton
        « Renseigner ». C'est elle qui déclenche l'alerte 30 jours avant l'expiration

}

function Bibliotheque() {
  const { useState } = React;
  const [saisies, setSaisies] = useState(() => ({ ...(PIECES_SAISIES.liste || {}) }));
  const admin = (BIBLIO.admin || []).map((p) => {
    /* La saisie de Gilles prime sur admin.json : c'est lui qui a la pièce en main.
       On recalcule le statut ici pour que l'effet se voie À L'INSTANT, sans attendre
       la veille du lendemain — un geste dont on ne voit pas l'effet passe pour une
       panne, et Gilles l'a déjà vécu le 02/09. */
    const v = saisies[p.piece];
    if (!v) return p;
    if (v.possede === false) return { ...p, statut: "absente", ok: false, expire: null, jours: null };
    if (!v.expire) return p;
    const jours = Math.round((new Date(v.expire) - new Date(new Date().toISOString().slice(0, 10))) / 86400000);
    const statut = jours < 0 ? "perimee" : jours <= 30 ? "expire_bientot" : "valide";
    return { ...p, expire: v.expire, jours, statut, ok: statut === "valide" };
  });
  const blocs = BIBLIO.blocs || [];
  const references = BIBLIO.references || [];
  const rediges = blocs.filter((b) => b.fichier).length;
  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
      <Panel>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", flexWrap: "wrap", gap: 6 }}>
          <SectionTitle>PIÈCES ADMINISTRATIVES — ALERTES D'EXPIRATION</SectionTitle>
          <span style={{ fontFamily: FM, fontSize: 11, color: T.steel }}>
            {admin.filter((p) => p.ok).length}/{admin.length} en règle
          </span>
        </div>
        <OuDeposerLesPieces />
        {admin.map((p, i) => (
          <LignePiece key={p.piece || i} p={p} premiere={i === 0} saisie={saisies[p.piece]}
            surSaisie={(nom, valeur) => setSaisies((v) => {
              const suite = { ...v };
              if (valeur === null) delete suite[nom]; else suite[nom] = valeur;
              PIECES_SAISIES.liste = suite;
              return suite;
            })} />
        ))}
        {!admin.length && <div style={{ fontSize: 12.5, color: T.steel }}>Aucune pièce administrative suivie pour le moment. La liste se remplit au prochain passage de la veille.</div>}
        <div style={{ marginTop: 8, fontSize: 12, color: T.steel }}>
          Toute pièce à moins de 30 jours d'expiration est signalée ici, dans le log du matin, et dans la checklist des consultations concernées.
        </div>
      </Panel>

      <Panel>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", flexWrap: "wrap", gap: 6 }}>
          <SectionTitle>BLOCS DE MÉMOIRE TECHNIQUE RÉUTILISABLES</SectionTitle>
          <span style={{ fontFamily: FM, fontSize: 11, color: rediges ? T.steel : T.amber }}>
            {rediges}/{blocs.length} rédigé(s)
          </span>
        </div>
        {blocs.map((b, i) => (
          <div key={i} style={{ display: "flex", justifyContent: "space-between", gap: 10, padding: "7px 0", borderTop: i > 0 ? `1px solid ${T.line}` : "none", flexWrap: "wrap", alignItems: "center" }}>
            <span style={{ fontSize: 13, color: b.fichier ? T.ink : T.steel }}>{b.fichier ? "✓" : "○"} {b.titre}</span>
            <span style={{ display: "flex", gap: 8, alignItems: "center" }}>
              {b.famille !== "Transverse" ? <FamilleBadge famille={b.famille} /> : <Badge color={T.steel} soft="#EEF1F3">TRANSVERSE</Badge>}
              <span style={{ fontFamily: FM, fontSize: 11, color: T.steel }}>
                {b.fichier ? `MàJ ${dateFr(b.maj) || "—"} · ${b.usages || 0} usages` : "à écrire une fois"}
              </span>
            </span>
          </div>
        ))}
      </Panel>

      <Panel>
        <SectionTitle>FICHES RÉFÉRENCES</SectionTitle>
        {references.map((r, i) => (
          <div key={i} style={{ display: "flex", justifyContent: "space-between", gap: 10, padding: "7px 0", borderTop: i > 0 ? `1px solid ${T.line}` : "none", flexWrap: "wrap", alignItems: "center" }}>
            <span style={{ fontSize: 13, color: T.ink }}>{r.titre}</span>
            <span style={{ display: "flex", gap: 8, alignItems: "center" }}>
              <FamilleBadge famille={r.famille} />
              <span style={{ fontFamily: FM, fontSize: 11, color: T.steel }}>{r.annee}</span>
            </span>
          </div>
        ))}
        {!references.length && (
          <div style={{ fontSize: 12.5, color: T.steel }}>
            Aucune fiche référence enregistrée. À saisir dans data/bibliotheque/references.json — une référence
            s'appuie sur un chantier réel, elle ne peut pas être pré-remplie automatiquement.
          </div>
        )}
      </Panel>
    </div>
  );
}

/* ---------- Marché (gagné-perdu) ---------- */
/* CINQ AFFAIRES QUI N'EXISTAIENT PAS — constat de Gilles, 07/09 : « peux-tu me les
   remettre en choix, ils ont été marqués gagné ou perdu sans raison ». Il croyait
   avoir mal tranché de vraies consultations. En réalité ces cinq lignes étaient des
   CONSTANTES DE DÉMONSTRATION écrites dans la page : « Skid chaufferie Chambéry —
   GAGNÉ 412 k€ », « Concurrent A a gagné 4/6 », « Gaine spiralée 36–44 €/ml ». Rien
   de tout cela n'a jamais existé. Au même moment, data/boucle.json disait la vérité :
   0 affaire close, taux de gain NON MESURABLE, aucun concurrent identifié.
   C'est la faute la plus grave du projet — celle du 31/08 (sept consultations
   espagnoles inventées) recommencée, mais sur le TAUX DE GAIN et le PRIX DE MARCHÉ,
   c'est-à-dire sur les deux chiffres qui servent à décider. Un prix de marché
   inventé qui part chez le BE ou dans une négociation, c'est une affaire perdue.
   Tout vient désormais des fichiers de la veille. Quand il n'y a rien, la page le
   dit — elle n'affiche jamais un chiffre pour avoir l'air complète. */
function Marche({ onOpen }) {
  const bilan = BOUCLE.bilan || {};
  const closes = CONSULTATIONS.filter((c) => (c.resultat || {}).statut);
  const observations = MARCHE.observations || [];
  const stC = {
    gagne: { c: T.go, s: T.goSoft, mot: "GAGNÉE" },
    perdu: { c: T.nogo, s: T.nogoSoft, mot: "PERDUE" },

/* ---------- Trancher une affaire hors des départements habituels ----------
   Demandé par Gilles le 28/08 : « on doit garder en apparent la fourniture et pose de
   gaines aérauliques dans le 63, on décidera manuellement si oui ou non on l'exclut ».

   Une pose de gaines à 200 km n'est pas un déchet : c'est le métier de CGM, sur une
   affaire simplement plus loin. Selon le montant, le client ou le chantier, elle peut
   valoir le déplacement — et aucune règle ne peut le savoir à la place de Gilles.
   Elle reste donc hors périmètre tant qu'il n'a rien dit (pas de deal créé tout seul
   sur une affaire lointaine), mais elle est MONTRÉE, et ces deux boutons tranchent. */
/* L'ENREGISTREMENT D'UN ARBITRAGE, à un seul endroit. Le panneau d'arbitrage et le
   bouton « Sortir du tableau » écrivent exactement la même chose dans
   data/decisions.json : deux copies de ce code auraient fini par diverger, et une
   décision enregistrée à moitié est pire que pas de décision du tout.
   Rien n'est effacé ici : on écrit un statut à côté de l'affaire, la veille du
   lendemain le relit et la fiche reste en base. */
/* ---------------------------------------------------------------------------
   LA FORME DE data/decisions.json — apprise à la dure le 02/09.

   Le fichier a DEUX étages : les sections à la racine (perimetre, contacts,
   maj_le, regle) et, sous « decisions », les affaires que Gilles a marquées
   gagnées ou perdues. Quatre endroits de cette page y écrivent. Le 01/09 à
   11h09, l'un d'eux a enveloppé le fichier ENTIER sous une clé « decisions »
   parce qu'il tournait sur le format historique (les identifiants d'affaire
   posés à la racine, sans clé « decisions »). « perimetre » a suivi sous
   l'enveloppe. Or scripts/collect.py lit « perimetre.affaires » À LA RACINE :
   le lendemain matin, les SEPT affaires que Gilles avait sorties du tableau
   étaient revenues. Aucune alerte, aucun test rouge — juste des fiches de
   retour.

   Tous les écrivains passent désormais par ici. La fonction ne jette rien :
   elle accepte le format historique, remet chaque clé à sa place, et sait
   défaire un fichier déjà enveloppé.
   --------------------------------------------------------------------------- */
const SECTIONS_DECISIONS = ["decisions", "perimetre", "contacts", "saisies", "pieces", "majors", "maj_le", "regle"];
/* APPLIQUER LES DÉCISIONS DÉJÀ PRISES — défaut trouvé par Gilles le 07/09 :
   « je sélectionne, mais l'affaire ne disparaît pas et le compteur ne tourne pas ».
   Mesuré : ses HUIT affaires refusées le matin même étaient TOUTES revenues au fil.
   La fiche quittait bien le fil à l'instant du clic — c'est la correction du 02/09 —
   mais uniquement en mémoire, dans la page ouverte. Au rechargement suivant, plus
   rien : la page relisait data/decisions.json pour les saisies, le périmètre et les
   pièces, mais JAMAIS pour les décisions elles-mêmes. Elles n'existaient donc que le
   lendemain matin, une fois scripts/boucle.py passé.
   Un geste qui tient une heure puis s'efface est pire qu'un geste qui échoue : on
   refait le travail sans savoir qu'on le refait. On applique donc ici, au démarrage,
   exactement ce que boucle.py écrira à 04h30 — sa décision prime, tout de suite et
   après rechargement. */
function appliquerDecisions(consultations, decisions) {
  let posees = 0;
  (consultations || []).forEach((c) => {
    const d = decisions && decisions[c.id];
    if (!d || typeof d !== "object") return;
    const statut = d.statut;
    if (!["gagne", "perdu", "refuse"].includes(statut)) return;
    if ((c.resultat || {}).statut === statut) return;   // déjà porté par la veille
    const refus = statut === "refuse";
    c.resultat = {
      statut,
      // Une affaire REFUSÉE ne porte ni prix ni titulaire : CGM n'a pas remis
      // d'offre. Même règle que scripts/boucle.py, au mot près.
      titulaire: refus ? null : (d.titulaire || (statut === "gagne" ? "CGM" : null)),
      montant_eur: refus ? null : (d.montant_eur ?? null),
      motif: refus ? (d.motif || null) : null,
      note: d.note || null,
      date: String(d.date || "").slice(0, 10) || null,
      source: "décision prise dans l'application",
      ferme_par: "décision de Gilles",
      en_attente_de_veille: true,
    };
    posees += 1;
  });
  return posees;
}

/* Ce que Gilles a renseigné lui-même pour ses pièces administratives, relu au
   démarrage depuis data/decisions.json (voir ecrirePiece plus bas). */
const PIECES_SAISIES = { liste: {} };
/* Ce que Gilles a renseigné lui-même sur la relation avec chaque major, relu au
   démarrage depuis data/decisions.json (voir ecrireMajor plus bas). Sa saisie prime
   sur data/majors.json : c'est lui qui connaît la relation, le registre ne porte que
   les noms publics qui servent à reconnaître un titulaire. */
const MAJORS_SAISIS = { liste: {} };
/* Combien de décisions la page a appliquées elle-même, faute que la veille soit
   encore passée. Sert à corriger les compteurs calculés avant elles. */
const DECISIONS_PRISES = { posees: 0 };

function normaliserDecisions(lu) {
  const base = { decisions: {}, perimetre: { affaires: {} }, contacts: {} };
  (function poser(source, profondeur) {
    if (!source || typeof source !== "object" || Array.isArray(source) || profondeur > 6) return;
    Object.keys(source).forEach((cle) => {
      const v = source[cle];
      if (cle === "decisions" && v && typeof v === "object" && !Array.isArray(v)) poser(v, profondeur + 1);
      else if (cle === "perimetre" && v && typeof v === "object" && !Array.isArray(v)) {
        Object.assign(base.perimetre.affaires, v.affaires || {});
        Object.keys(v).forEach((k) => { if (k !== "affaires") base.perimetre[k] = v[k]; });
      } else if ((cle === "contacts" || cle === "saisies" || cle === "pieces" || cle === "majors")
                 && v && typeof v === "object" && !Array.isArray(v)) {
        /* « saisies » = les consultations privées que Gilles tape lui-même.
           « pieces » = les dates des pièces administratives qu'il renseigne depuis
           l'onglet Bibliothèque (Kbis, URSSAF, assurances…).
           « majors » = la RELATION de CGM avec chaque major (référencement, agences,
           contacts, conditions), renseignée depuis l'onglet Majors · France. Sections
           à part entière : les ranger dans « decisions » les ferait disparaître de la
           page ET des scripts qui les lisent (prive.py, bibliotheque.py,
           majors_saisie.py). */
        base[cle] = { ...(base[cle] || {}), ...v };
      } else if (SECTIONS_DECISIONS.includes(cle)) { /* section connue, déjà traitée
        ou réécrite à l'enregistrement (maj_le, regle) : elle ne descend jamais
        dans « decisions ». Ajouter une section à la liste suffit à la protéger. */ }
      else base.decisions[cle] = v;
    });
  })(lu, 0);
  return base;
}

/* « Remportée par 0 » — constat de Gilles, 02/09. Il a marqué la Norvège perdue
   en tapant « 0 » dans les cases titulaire et commentaire, faute d'avoir mieux à y
   mettre. La fiche a donc annoncé que le marché avait été « remporté par 0 ».
   Un zéro, un tiret, un « néant » : ce sont des façons d'écrire « rien ». On ne les
   enregistre pas comme des faits — pas d'invention, mais pas de faux non plus. */
function saisieVide(texte) {
  const t = String(texte == null ? "" : texte).trim().toLowerCase();
  return t === "" || /^[0\-\.\s_/]+$/.test(t)
         || ["na", "n/a", "nc", "neant", "néant", "rien", "aucun", "aucune", "?"].includes(t);
}

/* ROUVRIR UNE AFFAIRE — 02/09. Gilles a mis une consultation en GO puis en
   « perdue » pour voir ce que ça donnait. Résultat : CGMTRACK a annoncé un taux
   de gain de 0 % et un concurrent nommé « 0 », et RIEN dans l'application ne
   permettait de revenir en arrière. Un essai devenait un fait définitif.
   Retirer la décision suffit : scripts/boucle.py rouvre alors la fiche. */
async function retirerResultat(ao) {
  const ecriture = window.CGMTRACK_ECRITURE;
  if (!ecriture || !ecriture.possible()) {
    const e = new Error("Rouvrir une affaire s'enregistre dans le dépôt : cela demande la copie de bureau et le jeton d'écriture.");
    e.sansJeton = true;
    throw e;
  }
  let base = { decisions: {} };
  try {
    const r = await fetch(ecriture.fichier + "?t=" + Date.now(), { cache: "no-store" });
    if (r.ok) base = normaliserDecisions(await r.json());
  } catch (e) { /* fichier absent : rien à retirer */ }
  delete base.decisions[ao.id];
  base.maj_le = new Date().toISOString().slice(0, 16);
  await ecriture.ecrire(ecriture.fichier, JSON.stringify(base, null, 1),
    `Affaire rouverte — ${ao.id}`);
  ao.resultat = null;
  if (window.CGMTRACK_REDESSINE) window.CGMTRACK_REDESSINE();
}

async function ecrireArbitrage(ao, statut) {
  const ecriture = window.CGMTRACK_ECRITURE;
  if (!ecriture || !ecriture.possible()) {
    const e = new Error("Cette décision s'enregistre dans le dépôt : cela demande la copie de bureau et le jeton d'écriture.");
    e.sansJeton = true;
    throw e;
  }
  let base = { decisions: {} };
  try {
    const r = await fetch(ecriture.fichier + "?t=" + Date.now(), { cache: "no-store" });
    if (r.ok) {
      const lu = await r.json();
      base = normaliserDecisions(lu);
    }
  } catch (e) { /* fichier absent : on le crée */ }
  if (!base.perimetre) base.perimetre = {};
  if (!base.perimetre.affaires) base.perimetre.affaires = {};
  base.perimetre.affaires[ao.id] = { statut, le: new Date().toISOString().slice(0, 10),
                                     par: "Gilles (application)" };
  base.maj_le = new Date().toISOString().slice(0, 16);
  await ecriture.ecrire(ecriture.fichier, JSON.stringify(base, null, 1),
    `${statut === "prise" ? "Affaire prise hors zone" : "Affaire écartée"} — ${ao.id}`);
  /* La décision est écrite : elle doit se VOIR immédiatement. Sans cela, la fiche
     garde son badge et reparaît dans le filtre — on arbitre deux fois la même
     affaire. On applique donc à la fiche en mémoire ce que la veille de demain lira
     dans decisions.json, et on redessine. */
  ao.a_trancher = null;
  ao.pose_hors_scope = null;
  const marque = "décision du " + new Date().toLocaleDateString("fr-FR")
               + " — prise en compte à la prochaine veille";
  if (statut === "prise") { ao.pris_hors_perimetre = marque; ao.ecartee_a_la_main = null; }
  else { ao.ecartee_a_la_main = marque; ao.pris_hors_perimetre = null; }
  if (window.CGMTRACK_REDESSINE) window.CGMTRACK_REDESSINE();
}

/* ---- RENSEIGNER UNE PIÈCE ADMINISTRATIVE DEPUIS LA PAGE --------------------
   Constat de Gilles, 07/09 : « le bouton est bien présent, mais j'ai l'impression
   que ça ne débouche sur rien » — puis, sans ambiguïté : « je ne sais toujours pas
   où insérer les éléments : Kbis, Assurance et autre !!! ».
   Vérifié dans un vrai navigateur : l'onglet Bibliothèque ne contenait AUCUN bouton
   ni AUCUN lien. Il annonçait huit pièces manquantes et renvoyait à un chemin de
   fichier — « data/bibliotheque/admin.json » — qui ne veut rien dire pour qui n'ouvre
   pas le dépôt. Une page qui réclame huit fois une pièce sans offrir le moindre
   endroit où la mettre n'est pas une alerte : c'est un mur.
   La date se saisit donc ICI, et elle part dans data/decisions.json — le SEUL fichier
   que le jeton d'écriture peut toucher, et ce garde-fou ne bouge pas. La saisie de
   Gilles prime sur admin.json : c'est lui qui a la pièce sous les yeux. */
async function ecrirePiece(nom, valeur) {
  const ecriture = window.CGMTRACK_ECRITURE;
  if (!ecriture || !ecriture.possible()) {
    const e = new Error("Renseigner une pièce s'enregistre dans le dépôt : cela demande la copie de bureau et le jeton d'écriture.");
    e.sansJeton = true;
    throw e;
  }
  let base = { decisions: {} };
  try {
    const r = await fetch(ecriture.fichier + "?t=" + Date.now(), { cache: "no-store" });
    if (r.ok) base = normaliserDecisions(await r.json());
  } catch (e) { /* fichier absent : on le crée */ }
  /* On COMPLÈTE la section, on ne l'affecte jamais en bloc : l'affecter effacerait
     les autres pièces déjà renseignées. C'est la leçon du 02/09, mot pour mot. */
  base.pieces = { ...(base.pieces || {}) };
  if (valeur === null) delete base.pieces[nom];
  else base.pieces[nom] = valeur;
  base.maj_le = new Date().toISOString().slice(0, 16);
  await ecriture.ecrire(ecriture.fichier, JSON.stringify(base, null, 1),
    valeur === null ? `Pièce remise à zéro — ${nom}` : `Pièce renseignée — ${nom}`);
}

/* ---- RENSEIGNER LA RELATION AVEC UN MAJOR DEPUIS LA PAGE -------------------
   Constat de Gilles, 09/09 : « sur cette page des majors - France je ne peux pas
   remplir ou modifier le statut des majors... ».
   Mesuré : seize fiches affichaient « STATUT À RENSEIGNER », « à renseigner »,
   « à documenter à la première consultation » — et l'onglet ne contenait aucun
   champ ni aucun bouton. Exactement le mur du 07/09 en Bibliothèque, au même
   endroit : une page qui réclame seize fois sans offrir nulle part où répondre.
   C'est la règle métier n° 14, et elle vaut PARTOUT.

   Ce qui se saisit ici, c'est la RELATION — statut de référencement, agences
   fréquentées, contacts, conditions constatées : personne d'autre que Gilles ne
   la connaît. Ce qui NE se saisit pas, ce sont les variantes de raison sociale et
   les domaines : ils servent à reconnaître un titulaire dans un avis
   d'attribution, et les laisser modifier depuis un navigateur casserait la
   détection sans que personne ne s'en aperçoive.

   La saisie part dans data/decisions.json → majors, le SEUL fichier que le jeton
   d'écriture peut toucher — ce garde-fou ne bouge pas. scripts/majors_saisie.py la
   recopie dans le registre avant les scripts qui le lisent. */
async function ecrireMajor(nom, saisie) {
  const ecriture = window.CGMTRACK_ECRITURE;
  if (!ecriture || !ecriture.possible()) {
    const e = new Error("Renseigner un major s'enregistre dans le dépôt : cela demande la copie de bureau et le jeton d'écriture.");
    e.sansJeton = true;
    throw e;
  }
  let base = { decisions: {} };
  try {
    const r = await fetch(ecriture.fichier + "?t=" + Date.now(), { cache: "no-store" });
    if (r.ok) base = normaliserDecisions(await r.json());
  } catch (e) { /* fichier absent : on le crée */ }
  /* On COMPLÈTE la section, on ne l'affecte jamais en bloc : l'affecter effacerait
     les quinze autres majors déjà renseignés. Leçon du 02/09, mot pour mot. */
  base.majors = { ...(base.majors || {}) };
  base.majors[nom] = { ...(base.majors[nom] || {}), ...saisie,
                       saisi_le: new Date().toISOString().slice(0, 16) };
  base.maj_le = new Date().toISOString().slice(0, 16);
  await ecriture.ecrire(ecriture.fichier, JSON.stringify(base, null, 1),
    `Major renseigné — ${nom}`);
  MAJORS_SAISIS.liste = { ...(MAJORS_SAISIS.liste || {}), [nom]: base.majors[nom] };
}

function ArbitragePerimetre({ ao, surDecision }) {
  const { useState } = React;
  const ecriture = window.CGMTRACK_ECRITURE;
  const [etat, setEtat] = useState(null);
  /* Un jeton d'écriture ENREGISTRÉ MAIS FAUX enfermait Gilles : le formulaire de
     saisie du jeton ne s'affiche que s'il n'y en a aucun, si bien qu'une fois le
     mauvais collé — le jeton de LECTURE, le plus souvent — plus rien ne permettait
     d'en changer. 31/08 : « github répond 404 », sans issue. */
  const [aChanger, setAChanger] = useState(false);
  /* …et le champ pour en coller un autre est ICI, pas dans un autre onglet.
     31/08 : après avoir oublié le mauvais jeton, il fallait aller le saisir dans
     « Consultations privées » pour revenir trancher. On ne fait pas traverser
     l'application à quelqu'un au milieu d'un geste. */
  const [saisie, setSaisie] = useState(null);
  /* Une fiche ordinaire n'attend aucun arbitrage — mais elle doit quand même pouvoir
     SORTIR DU TABLEAU. Jusqu'au 01/09 ce composant renvoyait null dans ce cas, et
     aucun bouton nulle part ne permettait d'écarter une consultation hors sujet :
     Gilles cliquait « Archiver (No Go) », qui ne faisait rien. */
  const ordinaire = !ao.a_trancher && !ao.pris_hors_perimetre && !ao.ecartee_a_la_main
                    && !ao.pose_hors_scope;

  const bouton = (fond) => ({ padding: "8px 16px", background: fond, color: "#fff",
                              border: "none", borderRadius: 5, fontWeight: 700,
                              fontSize: 13, cursor: "pointer" });

  async function trancher(statut) {
    setEtat("Enregistrement…");
    try {
      await ecrireArbitrage(ao, statut);
      setEtat(statut === "prise"
        ? "Prise. Elle revient dans le tableau. À la prochaine veille elle repart dans la chaîne comme les autres : chiffrage, positionnement, HubSpot."
        : "Écartée. Elle sort du tableau et ne sera plus proposée. Vous la retrouverez par le filtre « Écartées ».");
      if (surDecision) surDecision(statut);
    } catch (e) {
      setEtat(String(e.message || e));
      /* Sans jeton d'écriture du tout, proposer d'en « changer » n'a pas de sens :
         ce bouton oublie le jeton enregistré, et il n'y en a pas. */
      setAChanger(!e.sansJeton
                  && /jeton|Contents|écrire|401|403|404/i.test(String(e.message || e)));
    }
  }

  /* La sortie, quand le jeton enregistré est le mauvais : on l'oublie et la page
     redemande lequel utiliser. Rien n'est envoyé nulle part, rien n'est perdu. */
  const sortie = !aChanger ? null : saisie === null ? (

            setSaisie(null); setAChanger(false);
            setEtat("Jeton enregistré. Recliquez sur votre choix ci-dessus.");
          }}>
          Enregistrer sur ce poste
        </button>
        <button
          style={{ padding: "6px 12px", background: T.panel, color: T.steel, fontSize: 12.5,
                   border: `1px solid ${T.line}`, borderRadius: 5, cursor: "pointer" }}
          onClick={() => { setSaisie(null); setAChanger(false); }}>
          Annuler
        </button>
      </div>
    </div>
  );

  if (ao.pris_hors_perimetre) {
    return (

        <SectionTitle>AFFAIRE PRISE HORS ZONE</SectionTitle>

        {sortie && <div style={{ marginTop: 8 }}>{sortie}</div>}

  /* HORS SCOPE POUR CAUSE DE POSE — décision de Gilles, 01/09 : « toute affaire
     comportant de la pose ne rentre pas dans le scope des consultations que l'on
     souhaite, donc en grisé, et seulement si on fait le choix d'y aller on clique

  if (ao.pose_hors_scope && !ao.ecartee_a_la_main) {
    return (

        <div style={{ marginTop: 8, padding: "8px 10px", background: "#F6F8F9",

                      fontSize: 12.5, color: T.ink, lineHeight: 1.5 }}>
          <b>Ce qu'il y a à y gagner</b> — surveiller qui remporte le marché, puis se
          placer en sous-traitance auprès du titulaire. C'est la voie de gain n° 3 :

        <button style={{ ...bouton(T.blue), marginTop: 10 }} onClick={() => trancher("prise")}>

        </button>

        {sortie && <div style={{ marginTop: 8 }}>{sortie}</div>}

  if (ao.ecartee_a_la_main) {

        <button style={{ ...bouton(T.blue), marginTop: 10 }} onClick={() => trancher("prise")}>

        </button>

/* ---------- Consultations privées ----------
   Priorité n° 1 posée par Gilles le 24/08 : « priorité absolue aux consultations
   privées, petites comme importantes ». Jusqu'ici cet onglet affichait un entonnoir
   de démonstration — des chiffres, des taux de réponse et des outils que CGM n'a
   jamais utilisés. Il montre désormais les vraies : celles qui arrivent par e-mail,
   par téléphone ou par un major, et que Gilles saisit ici pour qu'elles traversent
   la même chaîne que les avis publics.

   L'écriture passe par le MÊME canal que les affaires gagnées : data/decisions.json,
   seul fichier que le jeton d'écriture peut toucher. La page n'écrit jamais dans
   data/consultations.json — c'est la veille du lendemain qui recopie. */

const ORIGINES = ["e-mail", "téléphone", "major / sous-traitance", "réseau, bouche à oreille",
                  "salon, visite", "autre"];

/* Gilles lit des dates françaises, pas des dates ISO : « 15/09 » et pas « 2026-09-15 ». */
function jourFr(iso) {
  const m = String(iso || "").match(/^(\d{4})-(\d{2})-(\d{2})/);
  return m ? `${m[3]}/${m[2]}` : (iso || "?");
}

function identifiantSaisie() {
  const d = new Date();
  const p = (n) => String(n).padStart(2, "0");
  return `PRIVE-${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}`;
}

function ConsultationsPrivees({ onOpen }) {
  const { useState } = React;
  const [tic, setTic] = useState(0);
  const ecriture = window.CGMTRACK_ECRITURE;
  const saisies = SAISIES.liste || {};
  const traitees = CONSULTATIONS.filter((c) => c.source === "Privée");
  const parId = Object.fromEntries(traitees.map((c) => [c.id, c]));
  const lignes = Object.entries(saisies)
    .filter(([, s]) => !s.retire)
    .sort((a, b) => String(b[1].saisi_le || "").localeCompare(String(a[1].saisi_le || "")));

  async function retirer(id) {
    if (!ecriture || !ecriture.possible()) return;
    try {
      const r = await fetch(ecriture.fichier + "?t=" + Date.now(), { cache: "no-store" });
      /* Même porte que partout ailleurs (règle métier n° 11) : ce lecteur-ci
         acceptait la forme à la racine et RENONÇAIT en silence sur la forme
         enveloppée — le bouton semblait ne rien faire. */
      const base = r.ok ? normaliserDecisions(await r.json()) : { saisies: {} };
      if (!base.saisies || !base.saisies[id]) return;
      base.saisies[id].retire = true;
      base.saisies[id].retire_le = new Date().toISOString().slice(0, 10);
      base.maj_le = new Date().toISOString().slice(0, 16);
      await ecriture.ecrire(ecriture.fichier, JSON.stringify(base, null, 1),
        `Consultation privée retirée — ${id}`);
      SAISIES.liste = base.saisies;
      setTic(tic + 1);
    } catch (e) { /* l'échec reste visible : la ligne ne bouge pas */ }
  }

  return (
    <div>
      <Panel style={{ marginBottom: 14 }}>
        <SectionTitle>CONSULTATIONS PRIVÉES</SectionTitle>
        <div style={{ fontSize: 12.5, color: T.ink, lineHeight: 1.55 }}>
          Celles qui n'arrivent par aucune plateforme : e-mail d'un client, appel d'un
          conducteur de travaux, demande de prix d'un major. Saisies ici, elles traversent
          <b> exactement la même chaîne</b> que les avis publics — famille, périmètre, score,
          positionnement, dossier de chiffrage, deal HubSpot si le score le justifie.
          Le traitement se fait à la veille suivante.
        </div>
      </Panel>

      <FormulairePrive surEnregistrement={() => setTic(tic + 1)} />

      {!lignes.length && (
        <Panel style={{ padding: 18, textAlign: "center" }}>
          <div style={{ fontSize: 13, color: T.steel }}>
            Aucune consultation privée saisie pour l'instant.
          </div>
        </Panel>
      )}

      <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
        {lignes.map(([id, s]) => {
          const c = parId[id];
          const note = c && c.scores ? calcScore(c.scores) : null;
          return (
            <Panel key={id} style={{ borderLeft: `4px solid ${c ? T.blue : T.steel}` }}>
              <div style={{ display: "flex", justifyContent: "space-between", gap: 10, flexWrap: "wrap", marginBottom: 6 }}>

                <span style={{ fontFamily: FM, fontSize: 11, color: T.steel }}>

              {s.note && (
                <div style={{ fontSize: 12, color: T.steel, marginTop: 4, fontStyle: "italic" }}>{s.note}</div>
              )}
              <div style={{ marginTop: 8, display: "flex", gap: 12, flexWrap: "wrap", alignItems: "center" }}>
                {s.limite && <span style={{ fontSize: 12, color: T.steel }}>remise le {jourFr(s.limite)}</span>}
                {s.contact && <span style={{ fontSize: 12, color: T.steel }}>{s.contact}</span>}
                {!c && (
                  <Badge color={T.amber} soft={T.amberSoft}>en attente de la prochaine veille</Badge>
                )}
                {c && note !== null && (
                  <span style={{ fontSize: 12.5, fontWeight: 700, color: note >= 45 ? T.go : note >= 35 ? T.amber : T.nogo }}>
                    {note}/85 — {note >= 45 ? "Go" : note >= 35 ? "à analyser" : "No Go"}
                  </span>
                )}
                {c && c.horsPerimetre && (
                  <span style={{ fontSize: 12, color: T.nogo }}>hors périmètre : {c.horsPerimetre}</span>
                )}
                {c && c.famille_incertaine && (
                  <span style={{ fontSize: 12, color: T.amber }}>{c.famille_incertaine}</span>
                )}
                {c && c.alerte_desenfumage && (
                  <span style={{ fontSize: 12, color: T.amber }}>{c.alerte_desenfumage}</span>
                )}
                {c && c.alerte_exclusion && (
                  <span style={{ fontSize: 12, color: T.nogo }}>{c.alerte_exclusion}</span>
                )}
                {c && (
                  <button onClick={() => onOpen && onOpen(c.id)}
                    style={{ fontSize: 12, fontWeight: 700, color: T.blue, background: "none", border: "none", cursor: "pointer", padding: 0 }}>

            </Panel>
          );
        })}
      </div>
    </div>
  );
}

/* Les quatre statuts de référencement, dans l'ordre où on les vit : on ne connaît
   pas, on dépose, on attend, on est référencé. Aucun autre n'existe — un statut
   inventé ne serait compris ni par prospection.py ni par attributions.py. */
const STATUTS_MAJOR = [
  { cle: "inconnu", libelle: "Statut à renseigner", court: "à renseigner" },
  { cle: "non_reference", libelle: "Non référencé", court: "non référencé" },
  { cle: "en_cours", libelle: "Référencement en cours", court: "en cours" },
  { cle: "reference", libelle: "Référencé", court: "référencé" },
];

/* Une fiche major, et le formulaire qui la renseigne.
   C'est ce qui manquait le 09/09 : la page affichait « STATUT À RENSEIGNER » seize
   fois et n'offrait aucun endroit pour le renseigner. La saisie part dans
   data/decisions.json → majors et prime sur data/majors.json. */
function FicheMajor({ m }) {
  const { useState } = React;
  const ecriture = window.CGMTRACK_ECRITURE;
  const modifiable = !!(ecriture && ecriture.possible());
  const saisie = (MAJORS_SAISIS.liste || {})[m.nom] || null;

  /* La saisie de Gilles recouvre le registre, champ par champ : renseigner le
     statut n'efface pas les agences saisies la semaine d'avant. */
  const vu = (cle) => (saisie && saisie[cle] !== undefined && saisie[cle] !== null)
                      ? String(saisie[cle]) : String(m[cle] || "");
  const statut = STATUTS_MAJOR.some((s) => s.cle === vu("statut")) ? vu("statut") : "inconnu";
  const libelle = (STATUTS_MAJOR.find((s) => s.cle === statut) || STATUTS_MAJOR[0]).libelle;
  const refOk = statut === "reference";

  const [ouvert, setOuvert] = useState(false);
  const [etat, setEtat] = useState(null);
  const [form, setForm] = useState(null);

  const champ = { padding: "6px 8px", border: `1px solid ${T.line}`, borderRadius: 4,
                  fontFamily: FM, fontSize: 12.5, width: "100%", boxSizing: "border-box" };
  const bt = (fond, texte) => ({ padding: "5px 11px", background: fond, color: texte || "#fff",
                                 border: fond === "#fff" ? `1px solid ${T.line}` : "none",
                                 borderRadius: 4, fontWeight: 600, fontSize: 12, cursor: "pointer" });

  function ouvrir() {
    setForm({ statut, contact: vu("contact"), date: vu("date"), agences: vu("agences"),
              contacts: vu("contacts"), conditions: vu("conditions") });
    setEtat(null);
    setOuvert(true);
  }

  async function enregistrer() {
    setEtat({ type: "encours", texte: "Enregistrement…" });
    try {
      await ecrireMajor(m.nom, form);
      setEtat({ type: "ok", texte: "Enregistré." });
      setOuvert(false);
      if (window.CGMTRACK_REDESSINE) window.CGMTRACK_REDESSINE();
    } catch (e) { setEtat({ type: "erreur", texte: String(e.message || e) }); }
  }

  /* Ce qu'on affiche quand rien n'est renseigné : on le DIT, on ne le devine pas
     (règle métier n° 10) — et le bouton juste à côté permet d'y répondre. */
  const cases = [["AGENCES SUR VOS ZONES", vu("agences"), "à renseigner"],
                 ["CONTACTS", vu("contacts"), "à renseigner"],
                 ["HISTORIQUE CONSULTATIONS", m.relation
                    ? `${m.relation} affaire(s) enregistrée(s)` : "", "aucune consultation enregistrée"],
                 ["CONDITIONS CONSTATÉES", vu("conditions"), "à documenter à la première consultation"]];

  return (
    <Panel style={{ borderLeft: `4px solid ${refOk ? T.go : T.amber}` }}>
      <div style={{ display: "flex", justifyContent: "space-between", gap: 10, flexWrap: "wrap", marginBottom: 6 }}>
        <div style={{ display: "flex", gap: 8, alignItems: "center", flexWrap: "wrap" }}>
          <span style={{ fontFamily: FD, fontWeight: 700, fontSize: 15, color: T.ink }}>{m.nom}</span>
          <Badge color={refOk ? T.go : T.amber} soft={refOk ? T.goSoft : T.amberSoft}>{libelle.toUpperCase()}</Badge>
        </div>
        <span style={{ display: "flex", gap: 10, alignItems: "center", flexWrap: "wrap" }}>
          <span style={{ fontFamily: FM, fontSize: 11.5, color: T.blue, fontWeight: 700 }}>Relation donneur d'ordre : {m.relation}/5</span>
          {modifiable && !ouvert && (
            <button style={bt("#fff", T.blue)} onClick={ouvrir}>
              {saisie ? "Modifier" : "Renseigner"}
            </button>
          )}
        </span>
      </div>
      <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(230px, 1fr))", gap: 8 }}>
        {cases.map(([l, val, defaut]) => (
          <div key={l} style={{ background: "#F6F8F9", border: `1px solid ${T.line}`, borderRadius: 4, padding: "7px 10px" }}>
            <div style={{ fontFamily: FM, fontSize: 9.5, fontWeight: 700, color: T.steel, letterSpacing: "0.06em", marginBottom: 3 }}>{l}</div>
            <div style={{ fontSize: 12, color: val ? T.ink : T.steel, lineHeight: 1.4 }}>{val || defaut}</div>
          </div>
        ))}
      </div>
      {(vu("contact") || vu("date")) && (
        <div style={{ marginTop: 6, fontSize: 12, color: T.ink }}>
          Référencement{vu("contact") ? ` — suivi par ${vu("contact")}` : ""}{vu("date") ? ` — depuis le ${dateFr(vu("date"))}` : ""}
        </div>
      )}
      {saisie && saisie.saisi_le && !ouvert && (
        <div style={{ fontSize: 11.5, color: T.steel, marginTop: 2 }}>
          Renseigné par vous le {dateFr(saisie.saisi_le)}
        </div>
      )}
      {!modifiable && !ouvert && (
        <div style={{ marginTop: 8, fontSize: 12, color: T.steel }}>
          Pour renseigner ces informations depuis la page, ouvrez la copie de bureau
          (cgmtrack-bureau.html) avec votre jeton d'écriture.
        </div>
      )}
      {ouvert && form && (
        <div style={{ marginTop: 10, background: "#F6F8F9", border: `1px solid ${T.line}`, borderRadius: 4, padding: 10 }}>
          <div style={{ fontFamily: FM, fontSize: 10, fontWeight: 700, color: T.steel, letterSpacing: "0.06em", marginBottom: 8 }}>
            RENSEIGNER LA RELATION AVEC {String(m.nom).toUpperCase()}
          </div>
          <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(220px, 1fr))", gap: 8 }}>
            <label style={{ fontSize: 12, color: T.ink }}>
              Statut de référencement
              <select style={{ ...champ, marginTop: 3 }} value={form.statut}
                      onChange={(e) => setForm({ ...form, statut: e.target.value })}>
                {STATUTS_MAJOR.map((s) => <option key={s.cle} value={s.cle}>{s.libelle}</option>)}
              </select>
            </label>
            <label style={{ fontSize: 12, color: T.ink }}>
              Qui suit le référencement chez eux
              <input style={{ ...champ, marginTop: 3 }} value={form.contact} placeholder="nom, service"
                     onChange={(e) => setForm({ ...form, contact: e.target.value })} />
            </label>
            <label style={{ fontSize: 12, color: T.ink }}>
              Depuis le
              <input type="date" style={{ ...champ, marginTop: 3 }} value={String(form.date || "").slice(0, 10)}
                     onChange={(e) => setForm({ ...form, date: e.target.value })} />
            </label>
            <label style={{ fontSize: 12, color: T.ink }}>
              Agences sur vos zones
              <input style={{ ...champ, marginTop: 3 }} value={form.agences} placeholder="Lyon, Grenoble…"
                     onChange={(e) => setForm({ ...form, agences: e.target.value })} />
            </label>
            <label style={{ fontSize: 12, color: T.ink }}>
              Contacts
              <input style={{ ...champ, marginTop: 3 }} value={form.contacts} placeholder="nom — fonction — e-mail"
                     onChange={(e) => setForm({ ...form, contacts: e.target.value })} />
            </label>
            <label style={{ fontSize: 12, color: T.ink }}>
              Conditions constatées
              <input style={{ ...champ, marginTop: 3 }} value={form.conditions} placeholder="paiement 60 j, retenue de garantie…"
                     onChange={(e) => setForm({ ...form, conditions: e.target.value })} />
            </label>
          </div>
          <div style={{ display: "flex", gap: 8, marginTop: 10, flexWrap: "wrap", alignItems: "center" }}>
            <button style={bt(T.blue)} onClick={enregistrer}>Enregistrer</button>
            <button style={bt("#fff", T.steel)} onClick={() => { setOuvert(false); setEtat(null); }}>Annuler</button>
            {etat && (
              <span style={{ fontSize: 12, fontWeight: 600,
                             color: etat.type === "erreur" ? T.nogo : etat.type === "ok" ? T.go : T.steel }}>
                {etat.texte}
              </span>
            )}
          </div>
          <div style={{ fontSize: 11.5, color: T.steel, marginTop: 8, lineHeight: 1.45 }}>
            Ce que vous écrivez ici est enregistré dans le dépôt et <strong>prime sur le
            registre</strong> : c'est vous qui connaissez la relation. Les raisons sociales et les
            domaines ne se saisissent pas — ils servent à reconnaître le titulaire d'un avis
            d'attribution.
          </div>
        </div>
      )}
      {!refOk && !ouvert && (
        <div style={{ marginTop: 8, fontSize: 12.5, color: T.amber, fontWeight: 600 }}>→ Action : {statut === "non_reference" ? "déposer le dossier de référencement au panel achats" : "relancer le référencement — c'est le robinet des consultations privées"}</div>
      )}
      {etat && !ouvert && (
        <div style={{ marginTop: 6, fontSize: 12, fontWeight: 600,
                      color: etat.type === "erreur" ? T.nogo : T.go }}>{etat.texte}</div>
      )}
    </Panel>
  );
}
